# SYSTEM-OWNED - do not edit, edits here are overwritten. This workflow is
# re-rendered from the central DSL teaching toolkit by 'Refresh actions' (nightly).
name: New materials repo

# `copy_from` starts the new repo as an existing one - every branch, every file, the whole
# history - instead of as the empty skeleton, which is how a course carries forward from
# one year to the next. Only the toolkit's own files are rewritten afterwards; yours
# arrive exactly as you left them. Leave it on the first option for a fresh starter.
# The dropdown is refreshed by the 'Refresh actions' workflow.
#
# The last two boxes write the new repo's `publish.yml` - what the cohort site may host
# publicly, so an HTML deck opens rendered in a browser instead of showing as source on
# GitHub. Everything else stays private, exactly as today. They seed the file and nothing
# more: edit it in the repo afterwards, and no workflow rewrites it. A copied repo brings
# its own, so they are ignored on `copy_from`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Year tag, e.g. f2026 or s2026 - creates course-materials-<tag>"
        required: true
      copy_from:
        description: "Materials repo to copy forward - (fresh starter) is the empty skeleton"
        required: false
        type: choice
        options:
          - (fresh starter)
          - course-materials-f2026
      public_dirs:
        description: "Rendered publicly on the cohort site: which folders. Everything else stays private to enrolled students"
        type: choice
        default: "(nothing public)"
        options:
          - (nothing public)
          - lectures
          - everything except readings
          - everything
      public_types:
        description: "Rendered publicly on the cohort site: which file types out of those folders"
        type: choice
        default: "html + pdf"
        options:
          - html
          - html + pdf
          - all files

permissions: {}

jobs:
  check-team:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the user may run actions for THIS repo
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          # Faculty & instructors have write+ on the course repos; students never do (and triggering a
          # workflow_dispatch already requires write), so repo permission is the gate.
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/tmp/gherr || true)
          case "$perm" in admin|write|maintain) exit 0 ;; esac
          echo "::error::@$ACTOR lacks write on $REPO (permission='$perm'). gh api said:"
          cat /tmp/gherr || true
          exit 1

  scaffold:
    needs: check-team
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: hertie-data-science-lab/dsl-teaching-toolkit
          ref: release
          # No credential left behind in $GITHUB_WORKSPACE/.git/config. Nothing here ever
          # pushes to the checkout - the central repo is public and read-only to these
          # jobs, and every write goes through `gh`/`gh auth setup-git` against ANOTHER
          # repo - so the persisted header buys nothing, and the grading jobs run the
          # student's own code with this directory on disk.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scaffold materials
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          DSL_BOT_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          ORG: ${{ github.repository_owner }}
          TAG: ${{ inputs.tag }}
          COPY_FROM: ${{ inputs.copy_from }}
          PUBLIC_DIRS: ${{ inputs.public_dirs }}
          PUBLIC_TYPES: ${{ inputs.public_types }}
        run: |
          gh auth setup-git
          args=(--org "$ORG" --tag "$TAG" \
            --public-dirs "$PUBLIC_DIRS" --public-types "$PUBLIC_TYPES")
          [ "$COPY_FROM" = "(fresh starter)" ] && COPY_FROM=""
          [ -n "$COPY_FROM" ] && args+=(--copy-from "$COPY_FROM")
          python3 -m dsl_course.scaffold materials "${args[@]}"
          python3 -m dsl_course.seed refresh --course-org "$ORG"

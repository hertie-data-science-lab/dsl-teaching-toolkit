# SYSTEM-OWNED - do not edit, edits here are overwritten. This workflow is
# re-rendered from the central DSL teaching toolkit by 'Refresh actions' (nightly).
name: Archive cohort

# End of term. The scheduler runs this by itself ONLY for a cohort whose schedule.yml
# writes an `archive:` block (its `date:` defaults to semester_end + 60 days). Archiving is
# opt-in, so this button closes a cohort out early - and is the only way to close out one
# that wrote no block. It offers the cohort's edits back to this org as a pull request
# first, closes the toolkit's open notices, syncs the website one last time, then ARCHIVES
# every repo in the cohort org - students' work, `welcome` so a finished term cannot still
# be joined, the released materials, the website, `.github` - writes the teardown record
# into the private classroom-config and archives that last, which is what tells every
# nightly sweep the cohort is finished.
# NOBODY IS REVOKED and NOTHING IS DELETED: an archived repo is read-only for everyone, so
# students keep read access to their own work, and un-archiving a repo from its own
# Settings page brings it back exactly as it was. Membership and teams are untouched.
# `dry_run` defaults to true and prints counts only. A real run refuses until the cohort's
# archive date has arrived; `force` says so by hand, which is how a cohort with no
# `archive:` block - and so no date - is closed out.
# A run that dies half way is resumed by running it again - see docs/10.

on:
  workflow_dispatch:
    inputs:
      cohort_org:
        description: "Cohort org"
        required: true
        type: choice
        default: "hertie-dsl-demo-f2026"
        options:
          - hertie-dsl-demo-f2026
      dry_run:
        description: "Preview the teardown - freeze nothing, open no pull request"
        type: boolean
        default: true
      force:
        description: "Close out before the cohort's archive date"
        type: boolean
        default: false

concurrency:
  group: ${{ github.repository }}-archive-cohort
  cancel-in-progress: false

permissions: {}

jobs:
  check-team:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the user may run actions for THIS repo
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          # Faculty & instructors have write+ on the course repos; students never do (and triggering a
          # workflow_dispatch already requires write), so repo permission is the gate.
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/tmp/gherr || true)
          case "$perm" in admin|write|maintain) exit 0 ;; esac
          echo "::error::@$ACTOR lacks write on $REPO (permission='$perm'). gh api said:"
          cat /tmp/gherr || true
          exit 1

  archive-cohort:
    needs: check-team
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: hertie-data-science-lab/dsl-teaching-toolkit
          ref: release
          # No credential left behind in $GITHUB_WORKSPACE/.git/config. Nothing here ever
          # pushes to the checkout - the central repo is public and read-only to these
          # jobs, and every write goes through `gh`/`gh auth setup-git` against ANOTHER
          # repo - so the persisted header buys nothing, and the grading jobs run the
          # student's own code with this directory on disk.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Archive cohort
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          COURSE_ORG: ${{ github.repository_owner }}
          COHORT_ORG: ${{ inputs.cohort_org }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          gh auth setup-git
          args=(--course-org "$COURSE_ORG" --cohort-org "$COHORT_ORG")
          if [ "$DRY_RUN" = "false" ]; then args+=(--no-dry-run); else args+=(--dry-run); fi
          [ "$FORCE" = "true" ] && args+=(--force)
          python3 -m dsl_course.teardown "${args[@]}"

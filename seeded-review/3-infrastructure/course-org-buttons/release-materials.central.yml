# SYSTEM-OWNED - do not edit, edits here are overwritten. This workflow is
# re-rendered from the central DSL teaching toolkit by 'Refresh actions' (nightly).
name: Release materials

# Central copy: pick the SOURCE repo in this course org, then the path(s) to copy into
# the cohort org. course_source_path and cohort_dest_path are comma-separated parallel lists paired
# by index - leave cohort_dest_path blank to mirror course_source_path. These are exactly a
# schedule.yml `deploy:` entry's fields.
# Dropdowns are refreshed by the 'Refresh actions' workflow.

on:
  workflow_dispatch:
    inputs:
      course_source_repo:
        description: "1. repo to release from in the course org"
        required: true
        type: choice
        default: "course-materials-f2026"
        options:
          - course-materials-f2026
      course_source_path:
        description: "2. within-repo folder/file path to copy from (or comma-separated list)"
        required: true
      cohort_org:
        description: "3. target cohort org"
        required: true
        type: choice
        default: "hertie-dsl-demo-f2026"
        options:
          - hertie-dsl-demo-f2026
      cohort_dest_repo:
        description: "4. repo to release to in the cohort org; created if missing"
        default: "materials"
        required: true
      cohort_dest_path:
        description: "5. within-repo destination path (blank mirrors box 2's path(s)); created if missing"
        required: false

concurrency:
  group: ${{ github.repository }}-release-materials
  cancel-in-progress: false

permissions: {}

jobs:
  check-team:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the user may run actions for THIS repo
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          # Faculty & instructors have write+ on the course repos; students never do (and triggering a
          # workflow_dispatch already requires write), so repo permission is the gate.
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/tmp/gherr || true)
          case "$perm" in admin|write|maintain) exit 0 ;; esac
          echo "::error::@$ACTOR lacks write on $REPO (permission='$perm'). gh api said:"
          cat /tmp/gherr || true
          exit 1

  release:
    needs: check-team
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: hertie-data-science-lab/dsl-teaching-toolkit
          ref: release
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          SRC_ORG: ${{ github.repository_owner }}
          COURSE_SOURCE_REPO: ${{ inputs.course_source_repo }}
          COHORT_ORG: ${{ inputs.cohort_org }}
          COURSE_SOURCE_PATH: ${{ inputs.course_source_path }}
          COHORT_DEST_REPO: ${{ inputs.cohort_dest_repo }}
          COHORT_DEST_PATH: ${{ inputs.cohort_dest_path }}
        run: |
          gh auth setup-git
          python3 -m dsl_course.deploy --source-org "$SRC_ORG" \
            --course-source-repo "$COURSE_SOURCE_REPO" --cohort-org "$COHORT_ORG" \
            --course-source-path "$COURSE_SOURCE_PATH" --cohort-dest-repo "$COHORT_DEST_REPO" \
            --cohort-dest-path "$COHORT_DEST_PATH"

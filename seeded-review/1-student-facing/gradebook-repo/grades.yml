# The file a student opens in their private grades-<handle> repo.
# Shape only - generated by grades.gradebook_entry / build_gradebooks / render_yaml.
# The faculty-internal `autograde_score` / `manual_score` columns are deliberately
# redacted; the student sees the authoritative `final_grade`, not the machine/manual
# split.
#
# NOTE: the key names below are all the student ever gets - there is no legend
# anywhere except the one-line README beside this file. `team_score`,
# `individual_adjustment` and `final_grade` are unexplained. Worth deciding whether
# the README should define them.
student: alexbeispiel
assignments:
  assignment-1:
    final_grade: A-
    individual_comments: Good work on Q3.
  assignment-4-project:
    team: team-x
    team_score: B+
    individual_adjustment: '+2'
    team_comments: Solid report; weak lit review.
    final_grade: A-
    individual_comments: Strong individual contribution.

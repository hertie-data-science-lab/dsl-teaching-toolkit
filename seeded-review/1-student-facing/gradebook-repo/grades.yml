# The file a student opens in their private grades-<handle> repo.
# SHAPE ONLY - generated by grades.gradebook_entry / build_gradebooks / render_yaml from
# classroom-config/grades/<assignment>.csv. Two entries below: an individual assignment
# and a group one.
#
# REDACTED: of the nine columns in the faculty CSV (grades.GRADE_FIELDS) the two
# faculty-internal ones NEVER reach the student - `autograde_score` (the machine's count of
# hidden tests passed) and `manual_score` (the marker's own mark). The student sees the
# authoritative `final_grade`, not the machine/manual split. `github_handle` becomes the
# `student:` key. Empty fields are dropped, so an individual assignment reads as just
# `final_grade` + `individual_comments`; the four group fields (`team`, `team_score`,
# `individual_adjustment`, `team_comments`) appear only on a group row.
#
# Every key below is defined in the README beside this file (grades._STARTER_README) -
# that table is the only legend a student is given.
student: alexbeispiel
assignments:
  assignment-1:
    final_grade: A-
    individual_comments: Good work on Q3.
  assignment-4-project:
    team: team-x
    team_score: B+
    individual_adjustment: '+2'
    team_comments: Solid report; weak lit review.
    final_grade: A-
    individual_comments: Strong individual contribution.

# No `assignments:` block. Handing one out generates a repo per ONBOARDED student, and
# nobody has claimed a roster row in this demonstration cohort - so a scheduled handout
# would fail every hour with "no onboarded enrolled students". The sibling cohort
# hertie-dsl-demo-f2026 shows the full assignment lifecycle instead.

# ------------------------------------------------------------------------------- archive
# archive the org (freezes in place): removes all write permissions, retains all read permissions
archive:
  date: 2027-09-01            # optional (default: semester_end + 60 days)
  show_on_site: true          # a "Cohort archived" row on the site's Schedule tab, also sends a notice email 14 days out
  description: >-             # optional, `{date}` is filled in with the date above
    This cohort is archived on {date}: every repository in it becomes read-only. You keep read access, so you can still fork or clone anything you want to keep working on into your own account.

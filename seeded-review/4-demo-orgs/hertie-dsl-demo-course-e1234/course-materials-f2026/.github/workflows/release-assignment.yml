# source: https://github.com/hertie-dsl-demo-course-e1234/course-materials-f2026/blob/main/.github/workflows/release-assignment.yml @ 8d0ceae
# SYSTEM-OWNED - do not edit, edits here are overwritten. This workflow is
# re-rendered from the central DSL teaching toolkit by 'Refresh actions' (nightly).
name: Release assignment

# Generates one private repo per onboarded student from the chosen assignment template
# repo (native template-generate). The assignment dropdown lists the course org's
# assignment-* template repos; refresh repopulates it.

on:
  workflow_dispatch:
    inputs:
      course_source_repo:
        description: "1. Course-org repo to hand out from"
        required: true
        type: choice
        default: "assignment-3-project-f2026"
        options:
          - assignment-1-f2026
          - assignment-2-f2026
          - assignment-3-project-f2026
      cohort_org:
        description: "2. Target cohort org"
        required: true
        type: choice
        default: "hertie-dsl-demo-f2026"
        options:
          - hertie-dsl-demo-f2025
          - hertie-dsl-demo-f2026
      include_solution:
        description: "3. Also push the model solution from the template's solution branch into every student repo"
        type: boolean
        default: false
      dry_run:
        description: "4. Preview only - list the repos that would be created, create nothing"
        type: boolean
        default: false

concurrency:
  group: ${{ github.repository }}-release-assignment
  cancel-in-progress: false

permissions: {}

jobs:
  check-team:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the user may run actions for THIS repo
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          # Faculty & instructors have write+ on the course repos; students never do (and triggering a
          # workflow_dispatch already requires write), so repo permission is the gate.
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/tmp/gherr || true)
          case "$perm" in admin|write|maintain) exit 0 ;; esac
          echo "::error::@$ACTOR lacks write on $REPO (permission='$perm'). gh api said:"
          cat /tmp/gherr || true
          exit 1

  provision:
    needs: check-team
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: hertie-data-science-lab/dsl-teaching-toolkit
          ref: main
          # No credential left behind in $GITHUB_WORKSPACE/.git/config. Nothing here ever
          # pushes to the checkout - the central repo is public and read-only to these
          # jobs, and every write goes through `gh`/`gh auth setup-git` against ANOTHER
          # repo - so the persisted header buys nothing, and the grading jobs run the
          # student's own code with this directory on disk.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Provision
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          MASTER_ORG: ${{ github.repository_owner }}
          COHORT_ORG: ${{ inputs.cohort_org }}
          COURSE_SOURCE_REPO: ${{ inputs.course_source_repo }}
          INC_SOL: ${{ inputs.include_solution }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          gh auth setup-git
          args=(--master-org "$MASTER_ORG" --course-source-repo "$COURSE_SOURCE_REPO" --cohort-org "$COHORT_ORG")
          [ "$INC_SOL" = "true" ] && args+=(--solution)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python3 -m dsl_course.assign "${args[@]}"

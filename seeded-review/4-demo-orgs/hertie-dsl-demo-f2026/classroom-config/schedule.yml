# source: https://github.com/hertie-dsl-demo-f2026/classroom-config/blob/main/schedule.yml @ 435f96f
# This cohort's schedule + auto-release plan. Edit here.
#
# Times are Europe/Berlin unless you set `timezone:`; the Scheduled release cron runs
# hourly, so times are honoured to the hour.
#
# The DEMO cohort: it deliberately exercises every feature the pipeline has - lecture,
# lab and readings deploys on staggered clocks (readings ship a week ahead on their own
# silent entries), individual and group assignments, exams,
# a dateless TBC row, and display-only special events.


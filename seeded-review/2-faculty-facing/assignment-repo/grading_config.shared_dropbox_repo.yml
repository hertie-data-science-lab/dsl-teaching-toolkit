# INSTRUCTOR-OWNED - defines the assignment. Dates live in the cohort's schedule.yml.
title: Data hunt              # the assignment's name, shown to graders and on the site
type: individual              # individual | group
# team_formation: self_select # self_select (students use the Join-team form) | assigned (you write teams.csv)
# max_team_size: 5            # group only
submit_via: shared_dropbox_repo # assignment_repo (they push to their repo) | external (handed in elsewhere: Moodle, Kaggle, in class - no repo is created) | shared_dropbox_repo (one private repo for the whole cohort, each student pushes into their own folder, peers can read it)
# submit_url: https://moodle.hertie-school.org/mod/assign/view.php?id=CHANGE-ME # external only: the `Submit on ...` button on the site (https only)
# visibility: private         # private (the student and the teaching team) | public (the whole internet: portfolio work, no receipts issue) | student_choice (private, and the student is its admin: theirs to publish after the grading cutoff, and no receipts issue) - read at hand-out only
format: ipynb                 # ipynb | py | rmd | qmd | latex | none - chooses the starter stub only; grading reads whatever is in the repo

# questions:                  # OPTIONAL - the score skeleton, and the maximum shown beside
#   Q1: 15                    # each blank in the grading sheet. The total is their sum;
#   Q2: 10                    # there is no `points:` field anywhere.

late_window_days: 10          # 0 = nothing after the due date is accepted
late_penalty_per_day: 10%     # of the EARNED grade, per day started

autograde: false              # hand-marked: a drop box is one repo for the whole cohort
completion_check: false       # hand-marked: a drop box is one repo for the whole cohort
grader_pdf: false             # hand-marked: a drop box is one repo for the whole cohort

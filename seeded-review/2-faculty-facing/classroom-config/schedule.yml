# This cohort's schedule + auto-release plan. Instructors edit directly. 
#
# Times are Europe/Berlin unless you set `timezone:`; the Scheduled release cron runs hourly, so times are honoured to the hour.
#
# Each block encodes BEHAVIOUR:
#   releases:     entries that DEPLOY materials (course org -> this cohort org)
#   assignments:  each assignment's handout / due / grading lifecycle
#   events:       display-only calendar rows - nothing deploys
#
# Changing a date later? Just commit the edit to this file on main; the hourly cron reads
# whatever is on main at each tick, so the change simply takes effect within the hour.
# Only already-fired ONE-SHOT actions don't rewind: a release already shipped stays
# shipped, and a snapshot/autograde that already ran needs its marker deleted to redo.
# Rewrite git history and force push to remove a release.
#
# What follows is a SKELETON: uncomment and fill what you want. For a full worked term -
# a real release plan, a group project, exams - see `schedule.yml.sample`.

# timezone: Europe/Berlin           

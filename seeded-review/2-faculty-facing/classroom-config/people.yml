# This cohort's own instructors/TAs 
#
# - the SSOT for their GitHub access & permissions 
# - supplies the deployed .github.io site's staff cards (name/title/photo/url). 
# - see reference: https://github.com/hertie-data-science-lab/dsl-teaching-toolkit/blob/main/docs/05-manage-teaching-team.md
#
# `photo` takes either (1) an absolute URL on a host that allows hotlinking (GitHub
# avatars always do), or (2) a site-relative path to an image committed into this
# cohort's site repo under `_images/pp/`. 
#
# THis is a SKELETON: uncomment and fill what you want. For a filled example - see `people.yml.sample`.
#
# people:
#   instructors:
#     - github_handle: "janedoe"      # REQUIRED -
#       name: "Prof. Jane Doe"        # optional 
#       title: "Professor of ..."     # optional
#       photo: "/_images/pp/jane.jpg" # optional. Either (1) a site-relative path to an image committed under `_images/pp/` in this cohort's site repo.
#                                     # OR (2)an absolute URL on a host that allows hotlinking.
#       url: "https://.../profile/jane"  # optional, display only
#       start: "{year}-09-01"           # optional - no start = active immediately
#       end: "{year_next}-01-31"             # optional - no end = indefinite
#   teaching_assistants:
#     - github_handle: "anOther"
#       name: "..."
#       photo: "https://github.com/anOther.png"   # the second form: a hotlinkable URL

course:
  name: Deep Learning for Public Policy
  code: E1394
  description: >
    One paragraph students see on every semester site and on the open course site.
  toolkit_version_ref: release    # absent = release | main | <tag> | <sha>
  licence: CC BY-NC-SA 4.0        # one of institution.licences; absent = the first

people:
  course_admins:                  # the course's owners: org admins, fault mail, shown as course leads on the open site
    - {github_handle: janedoe, name: Prof. Jane Doe, email: jane@hertie-school.org, title: Professor of Data Science}
    - {github_handle: asst01,  name: Alex Assistant, email: alex@hertie-school.org}

defaults:                         # every key present; uncomment to override. The comment shows the inherited value and its source.
  # timezone: Europe/Berlin                 (institution)
  # late_window_days: 10                    (institution)
  # late_penalty_per_day: 10%               (institution)
  max_team_size: 3                          # overrides the institution's 5
  # assignment_repo_visibility: private     (institution)
  # archive_grace_days: 60                  (institution)
  # materials_repo: materials               (institution)
  team_formation: self_select               # self_select | assigned; first set here (no institutional default)

open_course_site:                 # the public open-courseware site, <course-org>.github.io
  enabled: true
  spine: f2025                    # the semester whose schedule orders the sessions (default: the latest past one); sessions shown without dates
  publish: {kinds: [lectures, labs], reading_lists: true}   # a Selection: which kinds' files are published; reading LISTS (text) yes, readings files never unless `readings` is listed
  assignments:                    # per assignment number; absent = nothing published
    1: {brief: true, solution: false}
    2: {brief: true, solution: true}

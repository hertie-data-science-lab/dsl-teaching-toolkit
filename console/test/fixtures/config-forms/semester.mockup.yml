people:                           # who delivers THIS semester: GitHub access, fault mail, the student site's instructor cards
  - {github_handle: pteach, role: instructor, email: p@hertie-school.org, name: Dr P. Teach, title: Lecturer, photo: https://github.com/pteach.png, url: https://...}
  - {github_handle: tahelp, role: teaching_assistant, email: t@hertie-school.org, name: T. Help, start: 2026-09-01, end: 2027-01-31}

defaults:                         # every key present; uncomment to override. The comment shows the inherited value and its source.
  # timezone: Europe/Berlin                 (institution)
  late_window_days: 5                       # overrides the institution's 10
  # late_penalty_per_day: 10%               (institution)
  # max_team_size: 3                        (course)
  # assignment_repo_visibility: private     (institution)
  # archive_grace_days: 60                  (institution)
  # materials_repo: materials               (institution)
  # team_formation: self_select             (course)

student_site:                     # the semester's student site (public, no sign-in). Retired when the student console returns.
  syllabus: SYLLABUS.md           # the released path the home page pins (default SYLLABUS.md)
  host: {kinds: [lectures, labs, exams, events], types: [html, pdf]}   # a Selection: which released files get a viewable copy ON THE PUBLIC SITE. Default = every kind except readings (copyright); add `readings` to host them anyway

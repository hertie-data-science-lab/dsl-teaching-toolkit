# INSTRUCTOR-OWNED - yours to edit freely; edits here are not overwritten.
#
# This course across every semester: who it is, who owns it, the defaults its semesters
# inherit, and its open course site. Reference: docs/01-new-course-org.md
course:
  name: Deep Learning (Demo)
  code: E1234
  description: A public demonstration course run by the Hertie Data Science Lab - one course org and two cohort orgs showing the teaching toolkit end to end.
  toolkit_version_ref: main
  student_console: true

people:
  course_admins:
    - github_handle: henrycgbaker
    - github_handle: huydang90

defaults:   # every key present; uncomment to override. The comment shows the inherited value and its source.
  # timezone: Europe/Berlin                 (institution)
  late_window_days: 10
  late_penalty_per_day: 10%
  max_team_size: 4
  # assignment_repo_visibility: private     (institution)
  # archive_grace_days: 60                  (institution)
  # materials_repo: materials               (institution)
  # marks_per_question: true                (institution)
  # team_formation:                         (self_select | assigned; not set above)

open_course_site:   # the public website, an open version of one materials repo
  enabled: true   # false: nothing is published
  source_repo: course-materials-f2026   # the materials repo it is built from
  readings_mode: reading-list   # reading-list, actual-readings or none
  include_lectures: true   # publish the repo's files
  # contact: course@example.edu   # the site's contact; unset = the institution's
  # Paths kept off the website, as in .releaseignore. A course whose website is
  # off starts with the system folder kept off, and anything whose name has the
  # word solution, exam, grade, marks or private in it:
  withhold: []

# INSTRUCTOR-OWNED - yours to edit freely; edits here are not overwritten.
#
# This course across every semester: who it is, who owns it, the defaults its semesters
# inherit, and its open course site. Reference: docs/01-new-course-org.md
course:
  name: Natural Language Processing
  code: E1282
  description: The course provides a conceptual and applied introduction to Natural Language processing (NLP). The program introduces NLP within the broader fields of Machine Learning and Deep Learning. It will cover core topics such as text representation, text preprocessing, supervised and unsupervised learning with labeled and unlabeled datasets, model evaluations, and emerging trends including using other data sources such as audio and video.

people:
  course_admins:
    - github_handle: lramir14
    - github_handle: lonnychen
    - github_handle: henrycgbaker
    - github_handle: hertie-dsl-bot

defaults:   # every key present; uncomment to override. The comment shows the inherited value and its source.
  # timezone: Europe/Berlin                 (institution)
  # late_window_days: 10                    (institution)
  # late_penalty_per_day: 10%               (institution)
  # max_team_size: 5                        (institution)
  # assignment_repo_visibility: private     (institution)
  # archive_grace_days: 60                  (institution)
  # materials_repo: materials               (institution)
  # marks_per_question: true                (institution)
  # team_formation:                         (self_select | assigned; not set above)

open_course_site:   # the public website, an open version of one materials repo
  enabled: false   # false: nothing is published
  source_repo:    # the materials repo it is built from
  # contact: course@example.edu   # the site's contact; unset = the institution's
  # Which files it publishes: `kinds` (lectures, labs, readings, ...), `types`,
  # `include` and `exclude` (as in .releaseignore). Reading lists are text; the
  # readings themselves only when `readings` is listed. Solutions, tests and
  # grading files never appear.
  publish:
    kinds: [lectures, labs, exams, drop-ins, events]
    exclude: [.system/, '[Ss]olution*', '*[-_.][Ss]olution*', '*[Ee]xam', '*[Ee]xams', '*[Ee]xam[-_.]*', '[Gg]rade*', '*[-_.][Gg]rade*', '[Mm]arks*', '*[-_.][Mm]arks*', '*[Pp]rivate*']

# This semester: who delivers it, the defaults its assignments run on, and its student
# site. The dates live in schedule.yml; what each assignment IS lives in its template's
# grading_config.yml. Reference: https://github.com/hertie-data-science-lab/dsl-teaching-toolkit/blob/release/docs/05-manage-teaching-team.md
# Worked example: https://github.com/hertie-data-science-lab/dsl-teaching-toolkit/blob/release/example-course/semester-org/semester.yml

# Who delivers THIS semester: GitHub access, fault mail, the student site's instructor cards.

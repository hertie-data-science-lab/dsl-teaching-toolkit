# SYSTEM-OWNED - do not edit, edits here are overwritten. This workflow is re-seeded
# from the central DSL teaching toolkit by 'Refresh actions' (nightly).
name: Dispatch site sync

# Seeded into a semester's private semester-config repo as
# .github/workflows/dispatch-sync-site.yml (companion to dispatch-sync.yml, which handles
# membership). Its only job: fire the course org's Sync site whenever schedule.yml,
# instructors.yml or teams.csv changes here, so the semester website - which reads its release
# plan, session dates, due dates and exams from schedule.yml, its staff cards from
# instructors.yml, and which teams have room from teams.csv - refreshes immediately without a
# manual click.
#
# teams.csv is here because the Join-team workflow commits to it on every join, and an
# assignment page inside its team-formation window prints the teams that exist: left to
# the daily cron, a student who has just formed a team would not see it listed until the
# next day, by which time somebody else has opened a second team for want of one to join.
#
# instructors.yml also fires dispatch-sync.yml (event_type sync-membership). The two are
# independent: different workflows, different event types, different targets (teams vs the
# site repo), so both running on one push is expected and harmless.
#
# Reads the course org from THIS semester's own .system/dsl-course.yml `course:` pointer
# (single source of truth). Fires a repository_dispatch (not workflow_dispatch) so Sync
# site's ungated automatic path picks it up. Runs under secrets.DSL_BOT_TOKEN, which
# semester-config already carries (an infra repo) - unlike the content repos, so a direct
# edit to a released content repo is instead caught by Sync site's daily cron.

on:
  push:
    branches: [main]
    paths:
      - schedule.yml
      - assignments.yml
      - instructors.yml
      - teams.csv

# Everything here authenticates with DSL_BOT_TOKEN (reading this org's dsl-course.yml, and
# dispatching to the course org - neither of which the ambient token can do), so the
# ambient GITHUB_TOKEN is dropped to zero scopes.
permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Sync site in the course org
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          SEMESTER_ORG: ${{ github.repository_owner }}
        run: |
          course_org=$(gh api "repos/$SEMESTER_ORG/__CONFIG_REPO__/contents/__POINTER__" \
            --jq '.content | @base64d' | grep '^course:' | cut -d: -f2- | xargs)
          if [ -z "$course_org" ]; then
            echo "::error::no 'course:' line in $SEMESTER_ORG/__CONFIG_REPO__/__POINTER__ - can't find the course org to dispatch to."
            exit 1
          fi
          gh api "repos/$course_org/.github/dispatches" \
            -f event_type=sync-site \
            -f "client_payload[semester_org]=$SEMESTER_ORG"

# INSTRUCTOR-OWNED - yours to edit freely; edits here are not overwritten.
#
# How THIS semester runs each assignment. The dates live in schedule.yml; what the
# assignment IS (its title, type, questions, marking) lives in its template's
# grading_config.yml.
#
# - full schema: https://github.com/hertie-data-science-lab/dsl-teaching-toolkit/blob/__CENTRAL_REF__/docs/07-schedule-releases.md
#
# Every setting is optional. Nearest wins: the setting written on an assignment's own
# schedule.yml entry, then `defaults:` below, then the course's `assignment_defaults:`
# (.github/dsl-course.yml), then the institution's (policy.yml). The late window and
# penalty go together: a layer naming one of them sets the other to none.
#
# This is a SKELETON: uncomment and fill what you want.

# defaults:                         # this semester's defaults, for every assignment below
#   late_window_days: {late_window_days}            # institution default: {late_window_days}. 0 = nothing after the due date is accepted
#   late_penalty_per_day: {late_penalty_per_day}        # institution default: {late_penalty_per_day}. Of the earned mark, per day started
#   max_team_size: {max_team_size}               # institution default: {max_team_size}. Group assignments only
#   team_formation: {team_formation}    # institution default: {team_formation}. self_select (students use the Join team form) | assigned (you write teams.csv)
#   visibility: {visibility}           # institution default: {visibility}. private | public | student_choice. Read when each repo is created: change it before the first hand out

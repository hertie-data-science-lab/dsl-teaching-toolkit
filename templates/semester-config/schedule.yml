# INSTRUCTOR-OWNED - yours to edit freely; edits here are not overwritten.
#
# This semester's plan. Instructors edit it directly; a push takes effect within minutes.
#
# - full schema: https://github.com/hertie-data-science-lab/dsl-teaching-toolkit/blob/__CENTRAL_REF__/docs/07-schedule-releases.md
# - worked example: https://github.com/hertie-data-science-lab/dsl-teaching-toolkit/blob/__CENTRAL_REF__/example-course/semester-org/schedule.yml
# - see deployed end-product: https://hertie-dsl-demo-f2026.github.io/schedule/
#
# Times are {timezone} unless you set `timezone:`. Scheduled release ticks about every
# 15 minutes, so a time is honoured to roughly that, not to the minute.
#
# One block per kind (lectures, labs, readings, exams, events, assets) and assignments.
# Each block is a map whose KEY names what the toolkit creates for the entry (its site row,
# its ids; for an assignment the student repos `<key>-<handle>` and the mark sheet) and is
# never displayed or read for a number. Every entry takes the same fields:
#   session         the teaching unit (integer). REQUIRED on lectures and labs; optional on
#                   readings (absent = a standalone row); not used on exams, events, assets
#   number          optional, default = session: the row word ("Lab 2")
#   title, details  optional free text: the Title and Details columns of the site's schedule
#   event_datetime  REQUIRED: a datetime, `tbc`, or a list of slots {{at, location, details}}
#   location        optional (per entry or per slot)
#   show_on_site    optional, default true;  tbc  optional, default false (marks "(TBC)")
#   files           optional list: from_course_repo (required), from_path (required),
#                   to_semester_repo (default: materials), to_path (default: from_path),
#                   release_datetime (default: an hour before the first slot)
# No `files` key = a session with nothing to ship; `files: []` = "no files yet", a to-do.
# Nothing is ever derived from a key or a folder name.
#
# NB already-fired ONE-SHOT actions don't rewind: a snapshot, an autograde or a solution
# push needs its marker deleted to redo. A release already shipped stays shipped.
#
# What follows is a SKELETON: uncomment and fill what you want. For a full worked semester
# see the worked example above.

# timezone: {timezone}           # OPTIONAL - default: {timezone}
# semester_start:                   # OPTIONAL - the site's "Semester starts" row
# semester_end:                     # OPTIONAL - the default archive date counts from it

# lectures:
#   lecture-1:
#     session: 1                    # REQUIRED - the unit this lecture (and its lab, readings) belong to
#     title:                        # OPTIONAL - without it the row reads just "Lecture 1"
#     details:                      # OPTIONAL - shows on the Schedule and under the heading on the Lectures tab
#     event_datetime:               # REQUIRED - when the class happens
#     location:                     # OPTIONAL
#     files:                        # OPTIONAL - what ships, an hour before the class unless a file says otherwise
#       - from_course_repo:         # REQUIRED - a course-org repo
#         from_path:                # REQUIRED - folder or file to copy (any path; folder names mean nothing)
#         release_datetime:         # OPTIONAL

# labs:
#   lab-1:
#     session: 1                    # REQUIRED
#     number:                       # OPTIONAL - only when the lab's own count differs from the unit
#     event_datetime:               # REQUIRED - or two groups: a list of slots
#                                   #   - {{at: ..., location: Lab 2.30, details: Group 1}}
#                                   #   - {{at: ..., location: Lab 2.32, details: Group 2}}
#     files:
#       - from_course_repo:
#         from_path: labs/01
#       - from_course_repo:         # stage solutions OUTSIDE the folder above, else it ships them too
#         from_path: solutions/labs/01
#         to_path: labs/01/solutions
#         release_datetime:         # e.g. after the lab

# readings:
#   readings-week-1:
#     session: 1                    # OPTIONAL - shown on unit 1's first row and under it on the Readings tab; absent = a row of its own
#     event_datetime:               # REQUIRED - when it appears; its files ship then unless a file says otherwise
#     files: [{{from_course_repo: , from_path: readings/01}}]
#     reading_list: |               # OPTIONAL - markdown, shown on the site (and the only readings content the open site shows)
#       - Author, Title, ch. 1.

# exams:
#   exam-midterm:
#     title: Midterm exam
#     event_datetime:               # REQUIRED - a bare date is a whole day; `tbc` an undated row
#     location:

# events:
#   event-clinic:
#     title: Clinic drop-in
#     event_datetime:

# assets:                           # supporting files: released on their date, never a row or a tab
#   assets-data:
#     event_datetime:
#     files: [{{from_course_repo: , from_path: data}}]

# assignments:                      # HOW this semester runs each; WHAT it is lives in the template's grading_config.yml
#   assignment-1:                   # names the student repos assignment-1-<handle> and the mark sheet
#     number: 1                     # REQUIRED - "Assignment 1" on the site
#     template:                     # REQUIRED - the course-org template it hands out from
#     handout_datetime:             # OPTIONAL - absent = handed out only by hand
#     due_datetime:                 # REQUIRED - a bare date is the end of that day (23:59:59)
#     solution_datetime:            # OPTIONAL - NO default: absent = the solution only goes out by hand. Not before the late cutoff
#     marks_return_datetime:        # OPTIONAL - absent = marks returned by hand
#     details:                      # OPTIONAL - on both its schedule rows
#     # run settings, each OPTIONAL, each overriding assignments.yml `defaults:`, the course and the institution:
#     # late_window_days, late_penalty_per_day, max_team_size, team_formation,
#     # assignment_repo_visibility, marks_per_question, submit_url, repo_name, show_on_site, tbc

# archive the org (every repo read-only): removes all write permissions, retains all read permissions
archive:
  event_datetime:             # optional (default: semester_end + {grace_days} days)
  title: Semester archived      # optional - the row's Title column
  show_on_site: true          # a "Semester archived" row on the site's Schedule tab. The notice email 14 days out goes either way
  tbc: false                  # optional - true marks the date "(TBC)". Display only: the freeze still happens on the date above
  details: >-                 # optional, `{{date}}` is filled in automatically
    This semester is archived on {{date}}: every repository in it becomes read-only. You keep read access, so you can still fork or clone anything you want to keep working on into your own account.

# SYSTEM-OWNED - do not edit, edits here are overwritten. This workflow is re-seeded
# from the central DSL teaching toolkit by 'Refresh actions' (nightly).
name: Validate schedule

# Seeded into a cohort's private classroom-config repo as
# .github/workflows/validate-schedule.yml. Checks schedule.yml the moment it changes, in
# the repo it lives in - faculty edit here, so the verdict belongs here rather than behind
# a workflow in the course org.
#
# It CANNOT block the commit: workflows run after the push has landed, and branch
# protection needs a paid plan on a private repo. So it does the two things it can:
#   1. fails, which puts a red X against the offending commit;
#   2. opens an issue assigned to whoever pushed, which actually notifies them - a red X
#      only works if someone looks. The issue is closed automatically by the next commit
#      that parses clean, so it tracks the current state rather than accumulating.
#
# Validation runs the SAME parser the scheduler uses (dsl_course.schedule), checked
# out from the public central repo. A second implementation - a JSON schema, a hand-rolled
# checker - could drift, and its failure mode is the worst one available: passing a file
# the scheduler will silently drop entries from.
#
# A THIRD verdict arrives here and has no channel of its own: an empty course org means
# the toolkit could not read this cohort's own dsl-course.yml, which is nothing faculty can
# fix. It reds the run and says so in the annotation, and the annotation asks for the
# maintainer by name - it cannot email them. A cohort org carries DSL_BOT_TOKEN and nothing
# else: the GRAPH_* transport and DSL_MAINTAINER_EMAIL are set on COURSE orgs, nothing
# propagates them down here, and a mail step wired to secrets an org does not have sends to
# nobody while reading as a channel that works.
#
# The red X and the issue above are the DROPPED-ENTRY channel and nothing else. The run
# also checks whether the plan's sources exist in the course org, but that answer changes
# week to week (a lecture nobody has written yet is normal in August), so it never touches
# the exit code. Escalating one of those to a failure is the scheduler's job, which files
# its own, separately-titled digest issue - routing it through here would name the fault
# "entries the scheduler cannot read" and close it on the next clean parse, staged or not.
#
# What a source fault DOES get here is a commit comment, and only when the release is
# close enough that somebody is meant to hear about it. That is the one moment this
# workflow can say something the scheduler cannot: the person who just pushed is still at
# their keyboard, and the alternative is finding out from an email tomorrow. Distant faults
# get nothing - the digest issue holds them. The comment's TEXT is written by the engine
# (`--comment-file`), not assembled here: this step used to grep the report back for a rung
# prefix, which matched some rungs and not others, and counted an entry that had already
# fired among the ones still to come.

on:
  push:
    branches: [main]
    paths:
      - schedule.yml
  pull_request:
    paths:
      - schedule.yml
  workflow_dispatch:

# contents: write covers both things this job does to the repo it runs in: checking it
# out, and leaving a comment on the pushed commit (a commit comment is under the Contents
# permission, not Issues - the endpoint is repos/.../commits/<sha>/comments).
# issues: write is the escalation path this workflow exists for (see the header). Every
# write below actually runs on DSL_BOT_TOKEN, so this block is the declared intent rather
# than the token in use, and it stays at the two scopes rather than the default all.
permissions:
  contents: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to full commit SHAs: these steps share a job with DSL_BOT_TOKEN, and a
      # mutable tag is whatever the tag currently points at. Comment = the version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          path: cohort
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: __CENTRAL__
          ref: __CENTRAL_REF__
          path: central
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r central/requirements.txt

      # The course org this cohort belongs to, read from its own dsl-course.yml (the same
      # single source of truth dispatch-sync.yml reads - no org name baked in at bootstrap
      # time). A cohort's dsl-course.yml is SYSTEM-OWNED and always names `course:`, so an
      # empty answer here is an API error or a token that lost its scope - infrastructure,
      # not anything in the file that was just pushed. It used to be swallowed, which meant
      # the source check silently stopped running and every push looked clean.
      - name: Resolve the course org
        id: course
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          COHORT_ORG: ${{ github.repository_owner }}
        run: |
          course_org=$(gh api "repos/$COHORT_ORG/.github/contents/dsl-course.yml" \
            --jq '.content | @base64d' | grep '^course:' | cut -d: -f2- | xargs) || true
          echo "org=$course_org" >> "$GITHUB_OUTPUT"

      - name: Validate schedule.yml
        id: validate
        working-directory: central
        env:
          # Reading the COURSE org's (private) material repos is beyond the ambient token,
          # which is scoped to this repo. Absent, --check-sources is simply not passed.
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          COURSE_ORG: ${{ steps.course.outputs.org }}
        run: |
          set +e
          if [ -z "$COURSE_ORG" ]; then
            echo "::error::could not read this cohort's dsl-course.yml - the source check cannot run. This is not a fault in your file - the toolkit could not reach the course org. Tell the maintainer."
            exit 1
          fi
          check="--check-sources $COURSE_ORG --annotate --comment-file comment.txt"
          # stdout is the report; the ::warning:: annotations go to stderr, so they reach
          # the job log (where Actions renders them against schedule.yml in the commit's
          # own diff) without landing in the summary as raw workflow-command text.
          python3 -m dsl_course.schedule --file ../cohort/schedule.yml --validate $check > report.txt
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          {
            echo "## schedule.yml"
            echo ""
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat report.txt
          # Carry the report to the issue step, which only runs when this one fails.
          # The delimiter has a random suffix on purpose: report.txt is derived from a
          # faculty-authored schedule.yml, and a line equal to the delimiter would end the
          # heredoc early and let the rest of the file inject arbitrary step outputs.
          {
            echo "report<<REPORT_EOF_ba31d7c94f68"
            cat report.txt
            echo "REPORT_EOF_ba31d7c94f68"
          } >> "$GITHUB_OUTPUT"
          exit 0

      # The push that planned it is the cheapest moment to say so: the person who wrote
      # the line is still here. `sources_notify` and comment.txt are both written by the
      # process that knows the rung (dsl_course.schedule --annotate --comment-file), so
      # this step decides nothing - it posts what it was handed, and adds the one thing
      # only the workflow knows: where this repo's digest issue lives.
      - name: Comment on the push about a release with no materials
        if: github.event_name == 'push' && steps.validate.outputs.sources_notify == 'true'
        working-directory: central
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          COHORT: ${{ github.repository_owner }}
        run: |
          [ -s comment.txt ] || exit 0
          body=$(printf '%s\nThe generated GitHub record issue is https://github.com/%s/classroom-config/issues?q=is%%3Aissue+is%%3Aopen+schedule.yml.\n' \
            "$(cat comment.txt)" "$COHORT")
          gh api "repos/$REPO/commits/$SHA/comments" -f body="$body" >/dev/null

      - name: Open an issue naming what was dropped
        if: steps.validate.outputs.rc != '0' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT: ${{ steps.validate.outputs.report }}
        run: |
          title="schedule.yml has entries the scheduler cannot read"
          existing=$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number')
          body=$(printf '%s\n\n```\n%s\n```\n\nCommit: %s\nRun: %s\n\nA dropped entry is silently absent from the term plan - no release, or no deadline, snapshot or autograding. Fix `schedule.yml` on `main` and this issue closes itself.\n\nField reference: https://github.com/%s/blob/__CENTRAL_REF__/docs/07-schedule-releases.md' \
            "Validation of \`schedule.yml\` failed." "$REPORT" "$SHA" "$RUN_URL" "__CENTRAL__")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body" --assignee "$ACTOR" || \
              gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi

      - name: Close the issue once the schedule parses clean
        if: steps.validate.outputs.rc == '0' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          title="schedule.yml has entries the scheduler cannot read"
          for n in $(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$REPO" --comment "schedule.yml now parses with nothing dropped."
          done

      - name: Fail the run so the commit carries a red X
        if: steps.validate.outputs.rc != '0'
        run: |
          echo "::error file=schedule.yml::schedule.yml has entries the scheduler cannot read - see the run summary"
          exit 1

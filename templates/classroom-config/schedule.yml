# INSTRUCTOR-OWNED - yours to edit freely; edits here are not overwritten.
#
# This cohort's schedule + auto-release plan. Instructors edit it directly.
#
# - full schema: https://github.com/hertie-data-science-lab/dsl-teaching-toolkit/blob/__CENTRAL_REF__/docs/07-schedule-releases.md
# - see reference: https://github.com/hertie-dsl-demo-f2026/classroom-config/blob/main/schedule.yml
# - see deployed end-product: https://hertie-dsl-demo-f2026.github.io/schedule/
#
# Times are Europe/Berlin unless you set `timezone:`; the Scheduled release cron runs hourly, so times are honoured to the hour.
#
# Each block encodes BEHAVIOUR:
#   releases:     entries that DEPLOY materials (course org -> this cohort org)
#   assignments:  each assignment's handout / due / grading lifecycle
#   events:       display-only calendar rows - nothing deploys
#
# Changing a date later? Just commit the edit to this file on main; the hourly cron reads
# whatever is on main at each tick, so the change simply takes effect within the hour.
#
# Already-fired ONE-SHOT actions don't rewind: a release already shipped stays
# shipped, and a snapshot/autograde that already ran needs its marker deleted to redo.
# Unshipping a release means rewriting the cohort repo's git history and force-pushing.
#
# What follows is a SKELETON: uncomment and fill what you want. For a full worked term -
# a real release plan, a group project, exams - see `schedule.yml.sample`.

# timezone: Europe/Berlin           # OPTIONAL - default: Europe/Berlin
# semester_start:                   # OPTIONAL - default: inferred from the cohort tag (f2026 -> 1 Sep 2026)
# semester_end:                     # OPTIONAL - default: 15 weeks after the start

# releases:                         
#   seed-syllabus:                  # week 0: the course opens before teaching starts. 
#     event_datetime:               # REQUIRED - ships the syllabus and anything else students need up front
#     show_on_site: false           # OPTIONAL - default: true. false = releases materials silently without adding an entry to the deployed site's Schedule tab
#     deploy:
#       - course_source_repo:       # REQUIRED
#         course_source_path: SYLLABUS.md   # REQUIRED - NB here just a relative path to a root file
#
#   lecture-1:                      
#     event_datetime:               # REQUIRED - what the site's schedule shows (no valid date = the whole entry is dropped)
#     title:                        # OPTIONAL - default: the label, prettified (here "Lecture 1")
#     description:                  # OPTIONAL - a sentence about it, displays on the deployed site's Lectures tab
#     tbc: false                    # OPTIONAL - default: false. true = site marks it "(TBC)" next to the event_datetime on the deployed site
#     deploy:                       # OPTIONAL - omit it for a display-only row (a session with nothing to ship yet)
#       - course_source_repo:       # REQUIRED
#         course_source_path:       # REQUIRED - folder or file to copy
#         cohort_dest_repo:         # OPTIONAL - default: materials
#         cohort_dest_path:         # OPTIONAL - default: mirrors course_source_path
#         deploy_datetime:          # OPTIONAL - default: the event_datetime. But can set on its own clock - e.g. for lectures might want to release slides BEFORE/AFTER the lecture itself 
#       - course_source_repo:       # a SECOND file, on its own clock (here the second item itself is optional, but once specified the course_source_path is REQUIRED)
#         course_source_path:       
#         cohort_dest_path:         # OPTIONAL - default: mirrors course_source_path
#         deploy_datetime:          # OPTIONAL - default: the event_datetime
#
#   lab-1:                          
#     event_datetime:               # REQUIRED
#     title:                        # OPTIONAL
#     description:                  # OPTIONAL
#     deploy:
#       - course_source_repo:       # REQUIRED
#         course_source_path: labs/01_session-1   # REQUIRED
#         cohort_dest_repo:         # OPTIONAL - default: materials
#         cohort_dest_path:         # OPTIONAL - default: mirrors course_source_path
#         deploy_datetime:          # OPTIONAL - default: the event_datetime
#       - course_source_repo:       # NB stage solutions OUTSIDE the folder released above, else the first copy ships them too
#         course_source_path: labs/01_session-1/solutions
#         cohort_dest_repo:
#         cohort_dest_path:
#         deploy_datetime:          # could be set for AFTER the lab, so students work the empty notebooks/scripts first
#
#   readings-1:                     # each session's readings can optionally get their own entry, on their own clock (recommended)- they usually go out ahead of the session. (Could also be released as part of the lecture block above).
#     event_datetime:               # REQUIRED
#     show_on_site: false           # OPTIONAL - default: true
#     deploy:
#       - course_source_repo:       # REQUIRED
#         course_source_path: readings/01_session-1   # NB including an optional READINGS.md alongside the files themselves serves as a clean citation list (published publicly, whereas the files themeselves remain behind enrollment gating)
#         cohort_dest_repo:         
#         cohort_dest_path:         
#         deploy_datetime:          
#                                   
# assignments:                      
#   assignment-1:
#     title:                        # OPTIONAL - default: the template README's `# ` heading. The assignment's name, beside the slug on the deployed site (students SEE the slug, so keep it short and put the name here)
#     course_source_repo:           # REQUIRED - the course-org repo it hands out from
#     cohort_dest_repo:             # OPTIONAL - default: the slug above (here assignment-1)
#     handout_datetime:             # technically OPTIONAL, but REQUIRED for a scheduled handout - omit it if you hand out via the manual "Release assignment" workflow (which auto-records it here for you)
#     due_datetime:                 # REQUIRED - a bare date without time -> end of that day (23:59:59)
#     grading_datetime:             # OPTIONAL - default: due_datetime, so leaving it empty still autogrades at the deadline. Snapshot freezes + autograder fires. Not shown to students. To NOT autograde at all, set `autograde: false` in the template's grading.yml
#     solution_datetime:            # OPTIONAL - NO default: if empty, the solution only ever goes out by hand ("Release assignment" with include_solution ticked). Pushes the `solution/` folder (from the template's `solution` branch) into every student/team repo. Must be AFTER handout_datetime, and needs it set
#     type: group                   # OPTIONAL - default: individual (also settable in the template's grading.yml)
#     max_team_size:                # OPTIONAL - default: 5. Group only: the welcome "Join team" flow refuses a member beyond this

# events:                           # DISPLAY-ONLY calendar rows - nothing deploys
#   midterm-exam:
#     type: exam                    # OPTIONAL - default: special_event. exam | special_event; `exam` colours the row as an exam
#     title: Midterm exam           # OPTIONAL - default: prettified label
#     event_datetime:               # REQUIRED - bare date -> whole day;
#                                   # `event_datetime: tbc` -> an undated TBC row
#
#   final-exam:                     # no title -> the label, prettified: "Final Exam"
#     type: exam
#     event_datetime:               # REQUIRED
#
#   clinic-drop-in:                 # no type -> a special_event row
#     title: "Clinic drop-in"
#     event_datetime:               # REQUIRED

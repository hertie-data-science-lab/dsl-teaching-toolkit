# SYSTEM-OWNED - do not edit, edits here are overwritten. This workflow is re-seeded
# from the central DSL teaching toolkit by 'Refresh actions' (nightly).
name: Form team

# Seed this into a cohort's public `welcome` repo as
# .github/workflows/team-formation.yml. Students open a "Join team" issue here; the issue
# AUTHOR is the authenticated GitHub handle (unspoofable). We verify they are an onboarded
# ENROLLED student - auditors are read-only (released materials, no assignment repos) so they
# are refused - then append a row to the PRIVATE classroom-config/teams.csv - the only writer
# surface for team membership. A GitHub Team is materialised FROM that CSV later (one-way, by
# dsl_course.sync_teams), so the Team is a downstream projection that can't drift the way a
# Classroom-managed team does. Group-assignment provisioning grants that team its shared repo.
#
# WHETHER a team may form at all, and how big, is answered by
# classroom-config/assignments.lock.yml - written by the toolkit from each assignment's
# grading_config.yml, because that file lives in the course org and this token cannot
# reach it. An assignment the lock does not carry, or one it marks `assigned` or `none`,
# is refused here.
#
# teams.csv is PRIVATE, so a student had no way to see which teams exist or which have
# room: "type the name exactly" only ever worked for people who had already agreed a team
# face to face. After every successful join this workflow rewrites ONE public issue per
# assignment - `Teams for <assignment>` - in this repo. It carries team NAMES AND COUNTS
# ONLY: a team name is student-chosen and public by construction, who is in it is not.
#
# Runs under secrets.DSL_BOT_TOKEN, which needs, on the cohort org: Contents R/W on
# classroom-config, Issues R/W on welcome. PINNING that list is a GraphQL mutation and is
# best-effort on top: a token that cannot pin still writes the list, and the run stays
# green.

on:
  issues:
    types: [opened]

# Scoped PER ISSUE, deliberately. A repo-wide group serialises the teams.csv write, but
# GitHub keeps only ONE pending run per group: when a project deadline sends a burst of
# Join-team issues, the third arrival CANCELS the second, and a cancelled run posts no
# comment and adds no label, so those students are dropped in silence. Per-issue groups let
# the burst run in parallel. The CSV's read-modify-write is made safe by the `sha` it
# passes instead: a stale sha is a 409, never a lost update, and the script below re-reads,
# re-checks the team-size cap, and retries on one.
concurrency:
  group: team-formation-${{ github.event.issue.number }}
  cancel-in-progress: false

# The ambient GITHUB_TOKEN comments on, labels and closes the issue in THIS repo. It gets
# nothing else: teams.csv lives in another repo (classroom-config), which only
# DSL_BOT_TOKEN can reach, so `contents:` here would be scope with no purpose.
permissions:
  issues: write

jobs:
  form-team:
    # Routed by the FORM's label, not the title: the title is a fixed default the student
    # never edits (this workflow retitles the issue from the author + form fields).
    #
    # The public team list this workflow maintains wears `team-list`, NOT the routing
    # label below - it is opened with DSL_BOT_TOKEN, a PAT, whose issues (unlike the
    # ambient token's) DO start workflow runs. Were it to carry `team-formation`, opening
    # the list would answer it with "I can't find you on the enrolment roster", in public,
    # on the one issue the whole cohort is pointed at. Two labels, so that cannot happen -
    # rather than a title guard, which a retitled issue would slip past.
    if: contains(github.event.issue.labels.*.name, 'team-formation')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify enrolment, append team membership
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          github-token: ${{ secrets.DSL_BOT_TOKEN || github.token }}
          script: |
            const org    = context.repo.owner;            // the cohort org
            const issue  = context.payload.issue;
            const handle = issue.user.login;              // authenticated identity
            const CONFIG = 'classroom-config';
            const TEAMS  = 'teams.csv', ROSTER = 'students.csv';

            // {shared_script}

            try {
              if (!process.env.HAS_BOT) {
                return fail(
                  `Thanks @${handle} - team formation is **not yet armed**: the \`DSL_BOT_TOKEN\` secret ` +
                  `is unset, so I can't read the roster or record your team. A maintainer will action this.`,
                  'needs-review');
              }

              // Parse the assignment slug, the action and the team name from the issue form.
              // Same idiom for all three: the field's label, the newline(s) GitHub renders
              // after it, then the value. The action's value is one of the dropdown's two
              // options, and only its first word tells them apart.
              const aMatch = (issue.body || '').match(/Assignment\s*[\r\n]+\s*([A-Za-z0-9][\w.-]*)/i);
              const cMatch = (issue.body || '').match(/Action\s*[\r\n]+\s*([A-Za-z]+)/i);
              const tMatch = (issue.body || '').match(/Team\s*[\r\n]+\s*([A-Za-z0-9][\w-]*)/i);

              // What this assignment allows, read from the machine-written mirror the
              // toolkit keeps at classroom-config/assignments.lock.yml - THIS FILE AND
              // NOTHING ELSE. The answer lives in the template's grading_config.yml, in
              // the course org, which this token deliberately cannot reach; the
              // schedule.yml scrape that stood here before let a slug with no `type:`
              // mint a real GitHub team for any assignment at all.
              //
              // The toolkit writes the file, so its shape is fixed (see
              // dsl_course.grades.team_lock_text): two-space assignment keys, four-space
              // scalars under them. `undefined` = no lock file; `null` = a slug it does
              // not carry.
              //
              // `window` is null when the entry carries no `team_formation_window:` at
              // all, which is what a cohort last synced by a toolkit older than the window
              // looks like. That reads as OPEN below - the behaviour those cohorts have
              // had since the form existed - never as closed.
              const LOCK = 'assignments.lock.yml';
              const lockEntry = async (slug) => {
                let text;
                try {
                  const got = await github.rest.repos.getContent({ owner: org, repo: CONFIG, path: LOCK });
                  text = Buffer.from(got.data.content, 'base64').toString('utf8');
                } catch (e) {
                  if (e.status !== 404) throw e;
                  return undefined;
                }
                let inSlug = false, formation = null, cap = null, window = null, closes = '';
                for (const raw of text.split(/\r?\n/)) {
                  const line = raw.replace(/#.*$/, '').trimEnd();
                  const key = line.match(/^ {2}([\w.-]+):$/);
                  if (key) { inSlug = key[1].toLowerCase() === slug; continue; }
                  if (!inSlug) continue;
                  const f = line.match(/^ {4}team_formation:\s*(\w+)$/);
                  if (f) formation = f[1].toLowerCase();
                  const c = line.match(/^ {4}max_team_size:\s*(\d+)$/);
                  if (c) cap = parseInt(c[1], 10);
                  const w = line.match(/^ {4}team_formation_window:\s*(\w+)$/);
                  if (w) window = w[1].toLowerCase();
                  const d = line.match(/^ {4}team_formation_closes:\s*(\S*)$/);
                  if (d) closes = d[1];
                }
                return formation === null ? null : { formation, cap, window, closes };
              };
              // The close date is written as a bare ISO day and read by a student, so it is
              // spoken as one. Anything that is not one is printed as it stands rather than
              // guessed at.
              const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
              const spokenDate = (iso) => {
                const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
                return m ? `${parseInt(m[3], 10)} ${MONTHS[parseInt(m[2], 10) - 1]}` : iso;
              };

              if (!aMatch || !tMatch) return fail(
                `Thanks @${handle} - I couldn't read both an **Assignment** and a **Team** from the form. ` +
                `Team names use letters, numbers and dashes only. Please open a new issue.`,
                'needs-review');
              // Compared and stored lower-case: dsl_course.sync_teams lower-cases the slug it
              // materialises, so `Team-X` and `team-x` ARE the same team - the size cap and the
              // one-team-per-assignment rule below must see them that way too.
              const assignment = aMatch[1].toLowerCase();
              const team = tMatch[1].toLowerCase();
              // `null` when the form carried no readable Action - an issue opened from a
              // browser's cached copy of a form that predates the field. Neither `create`
              // nor `join`, so neither check below fires and the request is taken exactly
              // as it was before the field existed: joining the team if it is there,
              // starting it if it is not.
              const action = cMatch ? cMatch[1].toLowerCase() : null;
              // The GitHub team this row becomes is `<assignment>-<team>` (sync_teams.team_slug).
              // `course` + `admin` is `course-admin` - the faculty team with admin on every repo
              // in this org. Never let a form submission name a faculty team.
              const RESERVED = new Set(['course-admin', 'instructors', 'students', 'auditors']);
              const slug = `${assignment}-${team}`;
              // ONE reason-free message for every unavailable name. This issue is public, so a
              // message that said WHY ("a team can't be named after a GitHub handle") answered,
              // for any name anyone cared to try, whether that person is in this cohort.
              const NAME_TAKEN =
                `Thanks @${handle} - that assignment + team combination isn't available. Pick another team name.`;
              if (RESERVED.has(slug) || slug.startsWith('instructors-')) return fail(
                NAME_TAKEN, 'needs-review');

              // Verify the author is an onboarded student (handle recorded in the roster).
              // Columns (dsl_course.roster.FIELDS) are addressed BY NAME, never by position.
              const rosterRaw = await github.rest.repos.getContent({ owner: org, repo: CONFIG, path: ROSTER });
              const rosterTable = parseCsv(Buffer.from(rosterRaw.data.content, 'base64').toString('utf8'));
              const rosterHeader = (rosterTable[0] || []).map(h => h.trim());
              const iRosterHandle = rosterHeader.indexOf('github_handle');
              // `role` is OPTIONAL - a roster seeded before the column existed has none, and a
              // missing/blank cell means `enrolled` (dsl_course.roster.normalise_role). Never
              // required, so an older cohort's students keep forming teams.
              const iRole = rosterHeader.indexOf('role');
              if (iRosterHandle < 0) return fail(
                `Thanks @${handle} - the roster's header is missing a \`github_handle\` column. ` +
                `A maintainer will action this.`,
                'needs-review');
              // ONE message for "not on the roster" and "on it, but not as a project
              // participant". This issue is public and permanent, and telling the two apart
              // published the author's enrolment role to anyone who could read the repo.
              const NOT_A_PARTICIPANT =
                `Thanks @${handle} - I can't find you on the course enrolment roster yet. Please open a **Join course** issue first ` +
                `to onboard, then come back to join a team. If you have already joined, contact the teaching team.`;
              const myRow = rosterTable.slice(1)
                .find(r => (r[iRosterHandle] || '').trim().toLowerCase() === handle.toLowerCase());
              if (!myRow) return fail(NOT_A_PARTICIPANT, 'needs-review');
              // Auditors are read-only: assignment release is roster-driven (enrolled rows only),
              // so they never receive an assignment repo - and a group assignment's repo goes to
              // the whole team. Refuse politely rather than recording a membership that would
              // hand an auditor a group repo.
              // Neutral wording: this issue is public, and the roster role is not - so an
              // auditor gets the SAME message a non-enrolee does. Saying "your enrolment
              // doesn't include project work" published the author's role in a permanent,
              // world-readable issue.
              if (iRole >= 0 && (myRow[iRole] || '').trim().toLowerCase() === 'auditor') return fail(
                NOT_A_PARTICIPANT, 'needs-review');
              // A team may not be named after a roster handle: submission repos are
              // `<slug>-<handle>` and a group repo is `<slug>-<team>`, so a team called after a
              // classmate would be granted that classmate's repo if the assignment were ever
              // provisioned as a group.
              const handles = new Set(rosterTable.slice(1).map(r => (r[iRosterHandle] || '').trim().toLowerCase()).filter(Boolean));
              if (handles.has(team)) return fail(NAME_TAKEN, 'needs-review');

              // Read teams.csv (create it on first use). Columns: dsl_course.teams.FIELDS.
              const FIELDS = ['assignment', 'team', 'github_handle'];
              const readTeams = async () => {
                let sha = null, header = FIELDS, rows = [];
                try {
                  const got = await github.rest.repos.getContent({ owner: org, repo: CONFIG, path: TEAMS });
                  sha = got.data.sha;
                  const table = parseCsv(Buffer.from(got.data.content, 'base64').toString('utf8'));
                  if (table.length) { header = table[0].map(h => h.trim()); rows = table.slice(1); }
                } catch (e) {
                  if (e.status !== 404) throw e;
                }
                return { sha, header, rows };
              };
              const cell = (r, i) => (r[i] || '').trim();
              // What this assignment allows is per-assignment config, not a property of
              // teams.csv, so it is read once rather than on every retry below. Four ways
              // to be refused, and only one of them is the student's to fix.
              const lock = await lockEntry(assignment);
              if (lock === undefined) return fail(
                `Thanks @${handle} - I can't read this cohort's assignment list ` +
                `(\`classroom-config/${LOCK}\` isn't there). A maintainer will action this.`,
                'needs-review');
              if (lock === null) return fail(
                `Thanks @${handle} - \`${assignment}\` isn't an assignment in this cohort yet. ` +
                `Check the slug with the teaching team.`,
                'needs-review');
              if (lock.formation === 'none') return fail(
                `Thanks @${handle} - \`${assignment}\` is an individual assignment - no teams.`,
                'needs-review');
              // Anything that is not self-selection is the teaching team's to allocate -
              // `assigned`, and equally a value written by a newer toolkit than this
              // workflow. Both mean the same thing to a student: wait to be added.
              if (lock.formation !== 'self_select') return fail(
                `Thanks @${handle} - teams for \`${assignment}\` are assigned by the instructor. ` +
                `The teaching team will add you to one; there is nothing for you to do here.`,
                'needs-review');
              // The formation WINDOW, which runs from the handout to the grading pin. Only
              // an explicit `pending` or `closed` refuses: a lock written by a toolkit older
              // than the window carries no such scalar at all (`window` is null), and that
              // has to go on behaving exactly as it did - a cohort mid-semester must not
              // lose team formation because its nightly sync has not run yet.
              // `pending` and `closed` are the two sides of the window and they must not
              // share a sentence: before the handout `closes` is still in the FUTURE, so
              // the shut wording would tell a student in September that the door closed in
              // October.
              if (lock.window === 'pending') return fail(
                `Thanks @${handle} - team formation for \`${assignment}\` is not open yet. ` +
                `It opens when the assignment hands out` +
                (lock.closes ? `, and runs until ${spokenDate(lock.closes)}.` : `.`) +
                ` The course site carries the date.`,
                'needs-review');
              if (lock.window === 'closed') return fail(
                `Thanks @${handle} - team formation for \`${assignment}\` ` +
                (lock.closes ? `closed on ${spokenDate(lock.closes)}.` : `is closed.`) +
                ` Contact the teaching team if you still need a team for it.`,
                'needs-review');
              const cap = lock.cap;
              if (!(cap > 0)) return fail(
                `Thanks @${handle} - \`${assignment}\` has no team-size cap recorded. ` +
                `A maintainer will action this.`,
                'needs-review');

              // Read-modify-write, retried on a 409. Many Join-team issues are in flight at
              // once near a project deadline, and each appends to the SAME file; the `sha`
              // makes a lost update impossible (a stale one is a 409). The WHOLE decision is
              // re-taken on each attempt, not just the append: the duplicate-membership and
              // team-size checks are read off the file we are actually writing on top of, so a
              // team can't go over its cap by two students committing at the same moment.
              //
              // 409 = stale sha. 422 = the create-on-first-use race (our request carried no sha
              // because the file did not exist when we read it, but it does now). A 403 naming
              // GitHub's SECONDARY rate limit / abuse detection is GitHub asking us to back off -
              // a deadline-eve burst hits it - and is equally worth another attempt.
              const retryable = (e) => e.status === 409 || e.status === 422 ||
                (e.status === 403 && /secondary rate limit|abuse detection/i.test(String(e.message || '')));
              const ATTEMPTS = 8;
              // The rows AS WRITTEN, kept for the public team list below: it is rendered
              // from the file this run actually committed, never from a count carried
              // forward.
              let written = null;
              for (let attempt = 1; ; attempt++) {
                const { sha, header, rows } = await readTeams();
                const iAssign = header.indexOf('assignment');
                const iTeam = header.indexOf('team');
                const iHandle = header.indexOf('github_handle');
                if (iAssign < 0 || iTeam < 0 || iHandle < 0) return fail(
                  `Thanks @${handle} - \`teams.csv\` is missing a required column ` +
                  `(\`assignment\`, \`team\`, \`github_handle\`). A maintainer will action this.`,
                  'needs-review');

                // One team per student per assignment; respect the size cap; idempotent re-open.
                const mine = rows.find(r =>
                  cell(r, iAssign).toLowerCase() === assignment && cell(r, iHandle).toLowerCase() === handle.toLowerCase());
                if (mine && cell(mine, iTeam).toLowerCase() === team) {
                  await github.rest.issues.createComment({
                    owner: org, repo: context.repo.repo, issue_number: issue.number,
                    body: `You're already in **${team}** for \`${assignment}\` @${handle} - nothing to do.` });
                  await github.rest.issues.update({
                    owner: org, repo: context.repo.repo, issue_number: issue.number, state: 'closed' });
                  return;
                }
                if (mine) return fail(
                  `You're already in team **${cell(mine, iTeam)}** for \`${assignment}\` @${handle}. ` +
                  `Contact the teaching team to switch teams.`,
                  'needs-review');
                const size = rows.filter(r =>
                  cell(r, iAssign).toLowerCase() === assignment && cell(r, iTeam).toLowerCase() === team).length;
                // Create vs join used to be IMPLICIT - a name that existed joined, a name
                // that did not created - so `teamalpha` for `team-alpha` opened a silent
                // second team, and nobody found out until the handout provisioned two half
                // teams. The form now asks, and the two answers are checked against what
                // the file we are about to write actually says, re-read on every attempt.
                if (action === 'create' && size > 0) return fail(
                  `Thanks @${handle} - **${team}** already exists for \`${assignment}\` (${size}/${cap}). ` +
                  `Choose **Join an existing team** instead, or pick a different name.`,
                  'needs-review');
                if (action === 'join' && size === 0) {
                  // Near miss: same name once case and separators are taken out of it,
                  // which is what a mistyped join looks like. Sorted, so the answer to a
                  // name that is close to two of them is always the same one.
                  const flat = (s) => s.toLowerCase().replace(/[-_]/g, '');
                  const named = [...new Set(rows
                    .filter(r => cell(r, iAssign).toLowerCase() === assignment)
                    .map(r => cell(r, iTeam).toLowerCase())
                    .filter(Boolean))].sort();
                  const near = named.find(t => flat(t) === flat(team));
                  const nearSize = rows.filter(r =>
                    cell(r, iAssign).toLowerCase() === assignment && cell(r, iTeam).toLowerCase() === near).length;
                  return fail(
                    `Thanks @${handle} - there is no team **${team}** for \`${assignment}\`. ` +
                    (near
                      ? `Did you mean **${near}** (${nearSize}/${cap})?`
                      : `The teams that exist are listed in the pinned **Teams for \`${assignment}\`** issue - ` +
                        `or choose **Create a new team** to start this one.`),
                    'needs-review');
                }
                if (size >= cap) return fail(
                  `Thanks @${handle} - **${team}** already has ${size} member${size === 1 ? '' : 's'} ` +
                  `(the cap for \`${assignment}\` is ${cap}). Pick another team name.`,
                  'needs-review');

                // Append + write back (in the existing header's column order).
                const fresh = header.map(() => '');
                fresh[iAssign] = assignment; fresh[iTeam] = team; fresh[iHandle] = handle;
                rows.push(fresh);
                const body = serialiseCsv([header, ...rows]);
                try {
                  await github.rest.repos.createOrUpdateFileContents({
                    owner: org, repo: CONFIG, path: TEAMS, ...(sha ? { sha } : {}),
                    message: `teams: ${handle} -> ${team} (${assignment})`,
                    content: Buffer.from(body, 'utf8').toString('base64'),
                  });
                  written = { rows, iAssign, iTeam };
                  break;
                } catch (e) {
                  // Giving up is a RESULT, not a crash: an uncaught throw leaves a red run with
                  // no comment and no label, so the student is dropped in silence and nobody
                  // triages it. Every terminal path goes through fail() instead.
                  if (!retryable(e) || attempt === ATTEMPTS) return fail(
                    `Thanks @${handle} - I couldn't record your team after ${attempt} attempt(s) ` +
                    `(\`${e.status}\`). A maintainer will action this.`,
                    'needs-review');
                  // Jittered backoff: a burst that retries in lockstep just collides again on
                  // the same schedule, so each waiter spreads itself across ~400ms of its own.
                  await new Promise(r => setTimeout(r, 500 * attempt + Math.random() * 400));
                }
              }

              // The PUBLIC team list. teams.csv lives in the private classroom-config, so
              // "type its name exactly as that issue spells it" needs an issue that
              // spells them: a student who has nobody to team up with yet has, until this,
              // had no way to find out who has room - which is the likeliest reason a
              // cohort forms no teams at all.
              //
              // THE BODY IS STATE, NOT EVENTS - the same rule dsl_course.config_digest's
              // issues keep. It is rendered from the rows THIS run wrote, so it is
              // self-healing: the concurrency group above is per ISSUE by design (a
              // deadline-eve burst must not cancel itself), so two joins can reach this
              // point at once and one of them can lose its edit. A body rebuilt from the
              // file is right again on the very next join; a count incremented by one
              // would stay wrong for the rest of the term.
              //
              // NAMES AND COUNTS ONLY. This repo is PUBLIC and this issue is the one
              // thing in it the whole cohort is pointed at. A team name is student-chosen
              // and public by construction; who is in it is not - so no handle, no
              // person's name, no email and no `<slug>-<handle>` repo name may appear
              // here, ever.
              const TEAMS_ISSUE_PREFIX = 'Teams for ';
              const teamsIssueBody = (rows, iAssign, iTeam) => {
                const counts = new Map();
                for (const r of rows) {
                  if (cell(r, iAssign).toLowerCase() !== assignment) continue;
                  const name = cell(r, iTeam).toLowerCase();
                  if (name) counts.set(name, (counts.get(name) || 0) + 1);
                }
                const listed = [...counts.keys()].sort().map((name) => {
                  const taken = counts.get(name), free = cap - taken;
                  return `- **${name}** - ${taken}/${cap}, ${free > 0 ? `room for ${free}` : 'full'}`;
                });
                return [
                  `Up to ${cap} people per team.` +
                    (lock.closes ? ` Team formation closes on ${spokenDate(lock.closes)}.` : ''),
                  ``,
                  ...listed,
                ].join('\n');
              };
              // Found by its EXACT title among the issues carrying the `team-list` label
              // - `dsl_course.issues.find_issue`'s idiom, and the reason the title is fixed:
              // it is the key, so every run finds the one list rather than opening a
              // second. The list is never closed, so the open listing always holds it.
              const upsertTeamsIssue = async () => {
                const title = `${TEAMS_ISSUE_PREFIX}${assignment}`;
                const body = teamsIssueBody(written.rows, written.iAssign, written.iTeam);
                const open = (await github.paginate(github.rest.issues.listForRepo, {
                  owner: org, repo: context.repo.repo, state: 'open',
                  labels: 'team-list', per_page: 100,
                })).find(i => !i.pull_request && i.title === title);
                if (open) {
                  await github.rest.issues.update({
                    owner: org, repo: context.repo.repo, issue_number: open.number, body });
                  return;
                }
                const made = await github.rest.issues.create({
                  owner: org, repo: context.repo.repo, title, body, labels: ['team-list'] });
                // Pinned, because the Join-team form calls it "the pinned Teams for
                // <assignment> issue" and that sentence has to be true. REST cannot pin, so
                // this is the one GraphQL call in the file. A repo holds at most three
                // pinned issues, so a fourth group assignment's list is simply not pinned -
                // a reason to carry on, never to fail.
                try {
                  await github.graphql(
                    'mutation($id: ID!) { pinIssue(input: { issueId: $id }) { issue { number } } }',
                    { id: made.data.node_id });
                } catch (e) {
                  core.warning(`could not pin the team list for ${assignment} (${e.status || e.name})`);
                }
              };
              try {
                await upsertTeamsIssue();
              } catch (e) {
                // The membership is ALREADY in teams.csv by now. A cosmetic list that could
                // not be rewritten must never be reported to the student as a failed join,
                // and must not raise `needs-review` either: there is nothing here for a
                // human to fix that the next join will not fix by itself.
                core.warning(`could not update the team list for ${assignment} (${e.status || e.name})`);
              }

              // Confirm.
              await github.rest.issues.createComment({
                owner: org, repo: context.repo.repo, issue_number: issue.number, body: [
                  `Done **@${handle}** - you're in team **${team}** for \`${assignment}\`.`,
                  ``,
                  `- Membership is recorded; your team's repo appears once the teaching team provisions this assignment.`,
                  `- Need to change teams? Contact the teaching team.`,
                ].join('\n') });
              await github.rest.issues.addLabels({
                owner: org, repo: context.repo.repo, issue_number: issue.number, labels: ['team-recorded'] });
              // Title is auto-derived - the form's fixed default plus author + form fields.
              await github.rest.issues.update({
                owner: org, repo: context.repo.repo, issue_number: issue.number,
                title: `Join team: ${handle}`, state: 'closed' });
            } catch (e) {
              // Giving up is a RESULT, not a crash: an uncaught throw leaves a red run with no
              // comment and no label, so the student is dropped in silence and nobody triages
              // it. Every terminal path goes through fail() - this is the one for the paths
              // that did not expect to fail.
              await fail(
                `Thanks @${handle} - something went wrong on my side (\`${e.status || e.name}\`). ` +
                `A maintainer will action this; there is nothing you need to do.`,
                'needs-review');
            }
        env:
          HAS_BOT: ${{ secrets.DSL_BOT_TOKEN != '' || '' }}

# SYSTEM-OWNED - do not edit. This form's field ids are a contract with .github/workflows/team-formation.yml,
# which parses them; both are re-pushed by every bootstrap and nightly refresh.
name: Join team
description: Join or form a team for a group assignment
title: "Join team"
labels: ["team-formation"]
body:
  - type: markdown
    attributes:
      value: |
        The teams that already exist, and how much room each has left, are listed in the pinned **Teams for \<assignment\>** issue.

        To **join** one, choose *Join an existing team* and type its name exactly as that issue spells it. To **start** one, choose *Create a new team* and pick a name nobody is using yet.
  # dsl:assignment-field:start - this cohort's open assignments are spliced in here as a
  # dropdown by dsl_course.welcome.join_team_form; edits between these markers are
  # overwritten on the next refresh. The free-text field below is what a cohort with no
  # assignment open for team formation receives.
  - type: input
    id: assignment
    attributes:
      label: Assignment
      description: The assignment slug, spelt as the course site spells it.
      placeholder: "e.g. assignment-4-project"
    validations:
      required: true
  # dsl:assignment-field:end
  - type: dropdown
    id: action
    attributes:
      label: Action
      description: Joining a team and starting one are different things - say which, so a typo in the name below cannot silently open a second team.
      options:
        - Join an existing team
        - Create a new team
    validations:
      required: true
  - type: input
    id: team
    attributes:
      label: Team
      description: "Team name (letters, numbers, dashes)."
      placeholder: "e.g. team-x"
    validations:
      required: true

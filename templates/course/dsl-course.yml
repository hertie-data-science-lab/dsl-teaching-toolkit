# INSTRUCTOR-OWNED - yours to edit freely; edits here are not overwritten.
#
org: {org}
org_name: {org_name}
course_name: {course_name}
course_code: {course_code}
# central_ref: <40-character commit SHA>   # OPTIONAL: pin this course to one known
#   # commit of the central toolkit - the way to hold a course still, or back, while
#   # something is fixed. Unset means `release`, which is where every real course belongs.
#   # (`main` is the trunk and is also accepted, but only the demo course runs it: an org
#   # on `main` takes every merge the moment it lands. `preview` is a PR tip the maintainer
#   # force-pushes, for looking at a feature before it merges - the demo course and nothing
#   # else.) Semesters inherit this; setting it in a semester's own file does nothing.
# course_description: One or two sentences, on ONE line - the blurb on every semester site.
# site_link_extensions: [pdf, html, ipynb]   # OPTIONAL: on the SEMESTER sites, link ONLY
#   # these file types. Default (unset): each session's root files, plus one link per
#   # subfolder - so a rendered deck lists the deck, not its hundreds of assets. Either way
#   # everything you release still ships, and the folder itself is always one click away.
#   # (The public open-courseware site always lists root files - it hosts what it lists.)
#   # WHICH of those files the semester site hosts publicly, so an HTML deck opens rendered
#   # instead of showing as source, is `publish.yml` in the materials repo - not here.

# What every assignment under this course starts from. **New assignment** stamps these
# values into the `grading_config.yml` it generates, so each assignment's own file says
# what it does and can be edited there afterwards; changing them here changes the NEXT
# assignment, never one that already exists. The two late-work lines are the toolkit's
# own default, applied when they are absent here and from the assignment too. The four
# commented lines answer New assignment's boxes of the same name when they are left at
# "(course default)"; unset, the button uses the value shown.
assignment_defaults:
  max_team_size: 5            # group assignments only
  late_window_days: 10        # 0 = nothing after the due date is accepted
  late_penalty_per_day: 10%   # of the EARNED grade, per day started
  # formats: [ipynb]            # ipynb | py | rmd | qmd | latex | none - starters, first runnable
  # submit_via: assignment_repo # assignment_repo | external | shared_dropbox_repo
  # team_formation: self_select # self_select | assigned - group assignments only
  # visibility: private         # private | public | student_choice

# What Bootstrap semester writes into each NEW semester's schedule.yml. Changing it here
# changes the next semester, never one that already exists - edit that semester's
# schedule.yml instead. Unset, a new semester gets Europe/Berlin and is archived 60 days
# after its semester_end.
# semester_defaults:
#   timezone: Europe/Berlin     # the zone every time in the semester's schedule is read in
#   archive:
#     auto: true                # false = the semester is never archived automatically
#     grace_days: 60            # days after semester_end the semester is archived

# `course_name`, `course_code` and `course_description` are what reach the semester
# websites. Editing them here re-syncs every semester site already bootstrapped from this
# course org.
#
# This is the persistent COURSE org - it spans many semesters (years). Semesters are
# registered separately in .github/semesters.yml.


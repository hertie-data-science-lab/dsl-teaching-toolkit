# INSTRUCTOR-OWNED - yours to edit freely; edits here are not overwritten.
#
# This semester's own instructors: its instructors and teaching assistants, one list.
#
# - the SSOT for their GitHub access & permissions
# - the SSOT for who is emailed when this semester needs attention (see `email` below).
# - supplies the deployed .github.io site's instructor cards (name/title/photo/url).
# - see reference: https://github.com/hertie-data-science-lab/dsl-teaching-toolkit/blob/__CENTRAL_REF__/docs/05-manage-teaching-team.md
# - worked example: https://github.com/hertie-data-science-lab/dsl-teaching-toolkit/blob/__CENTRAL_REF__/example-course/semester-org/instructors.yml
# - see deployed end-product: https://hertie-dsl-demo-f2026.github.io/
#
# This is a SKELETON: uncomment and fill what you want. For a filled example - see the worked example above.
#
# instructors:
#   - github_handle: "janedoe"        # REQUIRED
#     role: instructor                # REQUIRED - instructor | teaching_assistant
#     email: "jane@example.org"       # REQUIRED
#                                     # notifications about this semester go here. Private: not shown on the semester site unless the entry adds `show_email: true`
#     name: "Prof. Jane Doe"          # optional
#     title: "Professor of ..."       # optional
#     photo: "/_images/pp/jane.jpg"   # optional. Either (1) a relative path to an image committed under `_images/pp/` in this semester's site repo,
#                                     # OR (2) an absolute URL on a host that allows hotlinking (NB: GitHub avatars always do).
#     url: "https://.../profile/jane" # optional
#     start: "{year}-09-01"           # optional - no start = active immediately
#     end: "{year_next}-01-31"        # optional - no end = indefinite
#   - github_handle: "anOther"
#     role: teaching_assistant
#     email: "another@example.org"
#     name: "..."
#     photo: "https://github.com/anOther.png"   # the second form: a hotlinkable URL

# SYSTEM-OWNED - do not edit. This form's field ids are a contract with .github/workflows/onboard.yml,
# which parses them; both are re-pushed by every bootstrap and nightly refresh.
# The student console opens the same issue through the API, with this form's body under a
# hidden first line, `<!-- dsl:join-course -->`, which routes it in place of the label.
name: Join course
description: Enrol in this course with the code your instructors emailed you
title: "Join course"
labels: ["onboarding"]
body:
  - type: markdown
    attributes:
      value: |
        This matches your GitHub handle to the course-registered Hertie email address. You will be automatically assigned as either an enrolled student or auditor, based on assignment by your instructors.
  - type: input
    id: enrol_code
    attributes:
      label: Enrolment code
      description: The code emailed to your Hertie email address (looks like dsl-xxxxxx).
      placeholder: "dsl-ab3k9m"
    validations:
      required: true

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read the code, run the tests, write nothing.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  jekyll-contract:
    # Do the templates in templates/site/ actually COMPILE against the front matter
    # site.py writes? pytest cross-checks the keys, which catches a field nothing writes;
    # only Jekyll catches a malformed tag, a bad filter argument or a recursive include
    # that never terminates. The last of those rendered an empty page rather than an
    # error and took two live cohort sites down.
    #
    # The fixture is generated by the real renderers - the same one
    # tests/test_site_templates.py reads - so it cannot drift into a shape the toolkit
    # never produces. The build is offline: the shared theme is not fetched (its
    # default/page/post layouts are stubbed), so a failure here is ours.
    # `jekyll-theme-seam` below builds the same fixture against the real theme.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: tests/fixtures/site

      - name: Generate the fixture cohort site
        run: python3 tests/fixtures/site/build_fixture.py "$RUNNER_TEMP/fixture"

      - name: Build it with Jekyll
        working-directory: tests/fixtures/site
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build \
            --strict_front_matter \
            --config "$RUNNER_TEMP/fixture/_config.yml,$RUNNER_TEMP/fixture/_config.offline.yml" \
            --source "$RUNNER_TEMP/fixture" \
            --destination "$RUNNER_TEMP/build"

      - name: Fail on a Liquid error rendered into a page
        # A syntax error fails the build above, but an unknown filter or a bad argument is
        # written INTO the output instead, where a green build would ship it.
        run: |
          if grep -rn "Liquid error\|Liquid Exception\|Liquid Warning" "$RUNNER_TEMP/build"; then
            echo "::error::a Liquid error was rendered into the built site"
            exit 1
          fi

      - name: Check the pages that can fail by rendering nothing
        # The recursive All Materials index and the schedule both empty themselves rather
        # than erroring, so assert a leaf from the fixture's deepest level and one row of
        # each kind actually reached the HTML. "Handed in outside GitHub" is the fixture's
        # `submit_via: external` assignment, whose wording is one half of an `{% if %}` -
        # a branch that renders nothing is the same silent failure.
        run: |
          cd "$RUNNER_TEMP/build"
          missing=0
          for needle in \
            "further-notes.pdf" "Handed in outside GitHub" \
            "table-row-lecture" "table-row-lab" "table-row-assignment" \
            "table-row-due" "table-row-exam" "table-row-special_event" \
            "table-row-term_date"; do
            grep -rq -- "$needle" . || { echo "::error::$needle is nowhere in the build"; missing=1; }
          done
          exit $missing

      - name: Check a published file renders from the site and an unpublished one does not
        # Publishing has two halves built by different code - the mirror that copies the
        # bytes and the front matter that links them - and a mismatch is a 404 on a live
        # site. The fixture publishes session 1's `slides.html` (with its `slides_files/`
        # bundle) and not the `slides.pdf` beside it, so one page carries both row shapes.
        run: |
          cd "$RUNNER_TEMP/build"
          missing=0
          for f in \
            files/course-materials/lectures/01_week-1/slides.html \
            files/course-materials/lectures/01_week-1/slides_files/figure/plot.svg; do
            if [ ! -f "$f" ]; then
              echo "::error::$f was never copied into the site"
              missing=1
            fi
          done
          if ! grep -rq 'href="[^"]*/files/course-materials/lectures/01_week-1/slides\.html"' .; then
            echo "::error::slides.html is published but no page links its hosted copy"
            missing=1
          fi
          if ! grep -rq 'slides\.html</a> <span class="file-btns">.*github\.com.*>source</a>.*>render</a>' .; then
            echo "::error::slides.html has no source and render buttons beside it"
            missing=1
          fi
          if ! grep -q 'slides\.html</a>.*· <a[^>]*github\.com[^>]*>source</a></span>\]' index.html; then
            echo "::error::the Updates box does not carry the inline source link"
            missing=1
          fi
          # The unpublished file beside it: `source`, because every file has a home on
          # GitHub, and no `render`, because this site hosts no copy of it to draw.
          if ! grep -rq 'slides\.pdf</a> <span class="file-btns">.*>source</a></span>' .; then
            echo "::error::slides.pdf carries no source button"
            missing=1
          fi
          if grep -rq 'slides\.pdf</a>.*>render</a>' .; then
            echo "::error::slides.pdf is not published but offers a rendered copy"
            missing=1
          fi
          # Every button in the row leaves the page, so every one of them leaves in a new
          # tab. `local` is the exception and is added by script, not here.
          if grep -rho '<a class="file-btn"[^>]*>' . | grep -v 'target="_blank"'; then
            echo "::error::a file-row button was rendered without target=_blank"
            missing=1
          fi
          exit $missing

      - name: Check the open-in-your-own-copy control ships
        # There is no JS runtime in this job, so what is checked here is what Liquid
        # RENDERED: the page the tab points at exists, the set-up line reaches a file list
        # and an assignment, and the assignment's repo shape reaches the script as a data
        # attribute rather than as prose. The Liquid-error check above covers the script's
        # own markup.
        run: |
          cd "$RUNNER_TEMP/build"
          missing=0
          grep -q 'id="dsl-profile"' profile/index.html || {
            echo "::error::/profile/ built without its form"; missing=1; }
          for step in 1 2 3 4; do
            grep -q "profile-step-num\">$step<" profile/index.html || {
              echo "::error::/profile/ built without step $step"; missing=1; }
          done
          for field in handle materials assignments editor; do
            grep -q "data-save=\"$field\"" profile/index.html || {
              echo "::error::/profile/ built without a Save for $field"; missing=1; }
            grep -q "id=\"dsl-saved-$field\"" profile/index.html || {
              echo "::error::/profile/ built without a saved line for $field"; missing=1; }
          done
          # The Assignments index offers each repo without the brief being opened. The
          # fixture hands out assignment 1 and leaves assignment 2 pending, so this also
          # checks the pending one gets no row.
          grep -q 'data-dsl-assignment="assignment-1-&lt;your-handle&gt;"' assignments/index.html || {
            echo "::error::the assignments index has no repo row for assignment 1"; missing=1; }
          if grep -q 'data-dsl-assignment="assignment-2' assignments/index.html; then
            echo "::error::the assignments index offers a repo for a pending assignment"
            missing=1
          fi
          # Every place the assignment page prints the repo shape is marked for the script.
          for f in assignments/01-assignment-1.html; do
            test "$(grep -c 'code data-dsl-repo' "$f")" -gt 0 || {
              echo "::error::$f does not mark the repo shape"; missing=1; }
            test "$(grep -c 'data-dsl-repo-url' "$f")" -gt 0 || {
              echo "::error::$f does not mark the repo link"; missing=1; }
          done
          for f in lectures/index.html assignments/01-assignment-1.html; do
            grep -q "Open files in your local copy" "$f" || {
              echo "::error::$f carries no set-up line"; missing=1; }
          done
          if grep -q "Open files in your local copy" profile/index.html; then
            echo "::error::/profile/ offers to send the reader to /profile/"
            missing=1
          fi
          grep -q 'data-repo-name="assignment-1-&lt;your-handle&gt;"' assignments/01-assignment-1.html || {
            echo "::error::the assignment page does not hand the script its repo shape"; missing=1; }
          exit $missing

      - name: Check the Updates box announces only what released
        # The home page's box is sorted newest-first over the WHOLE term, so an unfiltered
        # one announces the last week of term as "New Lab is up" before week one has
        # happened - which is what two live cohort sites showed all term. The fixture holds
        # a released session 2 beside an unreleased session 3, and a handed-out assignment
        # 1 beside a pending assignment 2, so the box is checked in both directions.
        run: |
          box=$(sed -n '/<h2>Updates<\/h2>/,/<\/ul>/p' "$RUNNER_TEMP/build/index.html")
          printf '%s\n' "$box"
          missing=0
          for needle in "Session 1" "Session 2" "Lab 1" "Assignment 1"; do
            if ! printf '%s' "$box" | grep -qF -- "$needle"; then
              echo "::error::the Updates box does not announce $needle, which released"
              missing=1
            fi
          done
          for needle in "Session 3" "Assignment 2"; do
            if printf '%s' "$box" | grep -qF -- "$needle"; then
              echo "::error::the Updates box announces $needle, which has not released"
              missing=1
            fi
          done
          exit $missing

  jekyll-theme-seam:
    # The same fixture, built against the REAL theme at the ref `site_repo.THEME_REF`
    # pins - the one seam the offline job above stubs out. The course stylesheet used to
    # ship rules that only worked nested inside the theme's, so a theme release could
    # flatten every live schedule with both repos' own checks green.
    #
    # The pin is not repeated here: it is already in the `_config.yml` the fixture
    # generates, so this build reads whatever site_repo says today. Needs the network
    # (jekyll-remote-theme fetches the theme from codeload.github.com).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: tests/fixtures/site

      - name: Generate the fixture cohort site
        run: python3 tests/fixtures/site/build_fixture.py "$RUNNER_TEMP/themed"

      - name: Drop the offline stand-ins the real theme supplies
        # A file in the site shadows the theme's copy, so leaving these in would build
        # against the stubs again and prove nothing.
        run: |
          rm -f "$RUNNER_TEMP/themed/_config.offline.yml"
          rm -f "$RUNNER_TEMP/themed/assets/css/main.scss"
          rm -f "$RUNNER_TEMP/themed"/_layouts/{default,page,post}.html
          grep "^remote_theme:" "$RUNNER_TEMP/themed/_config.yml"

      - name: Build it against the pinned theme
        working-directory: tests/fixtures/site
        # MUST match the Build step of templates/site/.github/workflows/deploy.yml, which
        # is the workflow every real site runs - anything extra here is help a live deploy
        # will not get, and this job is green on it while the site is down.
        # test_shipped_workflows.py holds the two to each other. BASE_PATH is the one
        # exception: an org root site's baseurl is empty and there is no Pages step here to
        # compute one.
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_REPO_NWO: ${{ github.repository }}
        run: |
          bundle exec jekyll build \
            --strict_front_matter \
            --config "$RUNNER_TEMP/themed/_config.yml" \
            --source "$RUNNER_TEMP/themed" \
            --destination "$RUNNER_TEMP/themed-build"

      - name: Check the course rules reached the compiled stylesheet
        # Whichever repo defines them, the compiled CSS must carry the schedule table's
        # layout, its row colours and the session blocks. True at the current pin (the
        # theme still defines the first two) and after a bump (templates/site/ does).
        run: |
          css="$RUNNER_TEMP/themed-build/assets/css/main.css"
          missing=0
          for needle in ".responsive-table" ".table-row-lecture" ".session-title"; do
            grep -qF -- "$needle" "$css" || { echo "::error::$needle is not in $css"; missing=1; }
          done
          exit $missing

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read the code, run the tests, write nothing.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  console:
    # The console's suite and typecheck, before merge: console-pages.yml runs them again on
    # main, where a failure only leaves the live console on the previous build.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: console/.nvmrc
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  relay:
    # The sign-in relay's suite and typecheck, before merge (relay-deploy.yml deploys on main).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  jekyll-contract:
    # Do the templates in templates/site/ actually COMPILE against the front matter
    # site.py writes? pytest cross-checks the keys, which catches a field nothing writes;
    # only Jekyll catches a malformed tag, a bad filter argument or a recursive include
    # that never terminates. The last of those rendered an empty page rather than an
    # error and took two live semester sites down.
    #
    # The fixture is generated by the real renderers - the same one
    # tests/test_site_templates.py reads - so it cannot drift into a shape the toolkit
    # never produces. The build is offline: the shared theme is not fetched (its
    # default/page/post layouts are stubbed), so a failure here is ours.
    # `jekyll-theme-seam` below builds the same fixture against the real theme.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: tests/fixtures/site

      - name: Generate the fixture semester site
        run: python3 tests/fixtures/site/build_fixture.py "$RUNNER_TEMP/fixture"

      - name: Build it with Jekyll
        working-directory: tests/fixtures/site
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build \
            --strict_front_matter \
            --config "$RUNNER_TEMP/fixture/_config.yml,$RUNNER_TEMP/fixture/_config.offline.yml" \
            --source "$RUNNER_TEMP/fixture" \
            --destination "$RUNNER_TEMP/build"

      - name: Fail on a Liquid error rendered into a page
        # A syntax error fails the build above, but an unknown filter or a bad argument is
        # written INTO the output instead, where a green build would ship it.
        run: |
          if grep -rn "Liquid error\|Liquid Exception\|Liquid Warning" "$RUNNER_TEMP/build"; then
            echo "::error::a Liquid error was rendered into the built site"
            exit 1
          fi

      - name: Check the pages that can fail by rendering nothing
        # The recursive All Materials index and the schedule both empty themselves rather
        # than erroring, so assert a leaf from the fixture's deepest level and one row of
        # each kind actually reached the HTML. "Handed in outside GitHub" is the fixture's
        # `submit_via: external` assignment, whose wording is one half of an `{% if %}` -
        # a branch that renders nothing is the same silent failure - and the banner is
        # behind one too.
        run: |
          cd "$RUNNER_TEMP/build"
          missing=0
          for needle in \
            "further-notes.pdf" "Handed in outside GitHub" \
            "Open this semester in the student console" \
            "table-row-lecture" "table-row-lab" "table-row-assignment" \
            "table-row-due" "table-row-exam" "table-row-special_event" \
            "table-row-term_date" "table-row-drop-in"; do
            grep -rq -- "$needle" . || { echo "::error::$needle is nowhere in the build"; missing=1; }
          done
          # A tab per kind the fixture has rows of, each listing its own: lecture 1 is on
          # the Readings tab too (its readings attach to it), the exam events on Exams, and
          # the lab folder released outside the plan on Labs.
          for tab in lectures:"Lecture 1" labs:"Lab 1" labs:"Week 2" labs:"Attention lab" readings:"Lecture 1" \
            readings:"Attention, further" drop-ins:"Drop-in 1" exams:"MidTerm Exam"; do
            grep -qF -- "${tab#*:}" "${tab%%:*}/index.html" || {
              echo "::error::${tab%%:*}/ does not list ${tab#*:}"; missing=1; }
          done
          # And each row's files under it. The list sits behind a guard on the `section`
          # the tab passes, and a guard that is never true empties every list silently.
          # Lectures and Labs list a row's own files; Readings lists lecture 1's reading
          # and none of its slides.
          for tab in lectures:"demo.py" labs:"Lab_Session_1.ipynb" readings:"schmidhuber-1997.pdf" \
            readings:"attention.pdf"; do
            grep -o '<ul class="session-files">.*</ul>' "${tab%%:*}/index.html" \
              | grep -qF -- "${tab#*:}" || {
              echo "::error::${tab%%:*}/ lists no file ${tab#*:}"; missing=1; }
          done
          # The fixture's `event_datetime: tbc` lab: a row whose Date cell reads TBC on the
          # schedule, and TBC under its heading on the Labs tab.
          if ! perl -0ne 'exit !m{<li class="table-row table-row-lab"(?:(?!</li>).)*?data-label="Date">\s*TBC\s*</div>(?:(?!</li>).)*?Attention lab}s' schedule/index.html; then
            echo "::error::schedule/ has no TBC row for the undated lab"; missing=1
          fi
          if ! tr -d '\n' < labs/index.html | grep -q 'Attention lab</h2>[[:space:]]*<p class="session-when"><b>TBC</b></p>'; then
            echo "::error::labs/ does not mark the undated lab TBC"; missing=1
          fi
          if grep -qF "slides.pdf" readings/index.html; then
            echo "::error::readings/ lists lecture 1's slides, not only its readings"
            missing=1
          fi
          # And the other way round: lecture 1's attached readings (file and citations)
          # are on Readings only, not under it on Lectures (decision 0013 rule 3).
          for needle in "schmidhuber-1997.pdf" "Long short-term memory"; do
            if grep -qF -- "$needle" lectures/index.html; then
              echo "::error::lectures/ lists lecture 1's reading $needle"
              missing=1
            fi
          done
          exit $missing

      - name: Check a published file renders from the site and an unpublished one does not
        # Publishing has two halves built by different code - the mirror that copies the
        # bytes and the front matter that links them - and a mismatch is a 404 on a live
        # site. The fixture publishes lecture 1's `slides.html` (with its `slides_files/`
        # bundle) and not the `slides.pdf` beside it, so one page carries both row shapes.
        run: |
          cd "$RUNNER_TEMP/build"
          missing=0
          for f in \
            files/course-materials/lectures/01_week-1/slides.html \
            files/course-materials/lectures/01_week-1/slides_files/figure/plot.svg; do
            if [ ! -f "$f" ]; then
              echo "::error::$f was never copied into the site"
              missing=1
            fi
          done
          if ! grep -rq 'href="[^"]*/files/course-materials/lectures/01_week-1/slides\.html"' .; then
            echo "::error::slides.html is published but no page links its hosted copy"
            missing=1
          fi
          # The published file: its name opens the hosted copy (above), and the chevron's
          # menu offers `View here` (that copy) and `View on GitHub` (the file's home).
          menu() { grep -rho "$1</a><details class=\"file-menu\">.*" . | sed 's#</details>.*##'; }
          if ! menu 'slides\.html' | grep -q 'github\.com.*</svg>View on GitHub</span>'; then
            echo "::error::slides.html has no chevron menu with a View on GitHub row"
            missing=1
          fi
          if ! menu 'slides\.html' | grep -q '</svg>View here</span><small>rendered here</small>'; then
            echo "::error::slides.html is published but its menu has no live View here row"
            missing=1
          fi
          if ! grep -q 'slides\.html</a>.*· <a[^>]*github\.com[^>]*>GitHub</a></span>\]' index.html; then
            echo "::error::the Updates box does not carry the inline GitHub link"
            missing=1
          fi
          # The unpublished file beside it: `View on GitHub`, because every file has a home
          # on GitHub, and no `View here`, because this site hosts no copy of it.
          if ! menu 'slides\.pdf' | grep -q '</svg>View on GitHub</span>'; then
            echo "::error::slides.pdf has no chevron menu with a View on GitHub row"
            missing=1
          fi
          # Every menu lists its rows in order - `View here` first only for a hosted copy -
          # with a hairline before the Edit pair, which is always listed: greyed for a
          # pdf's format, for a notebook the Profile step the script fills in from the
          # reader's browser.
          items() { menu "$1" | head -1 | grep -o '</svg>[^<]*</span>\|file-menu-sep' | sed 's#</svg>##; s#</span>##' | paste -sd, -; }
          for want in 'slides\.html:View here,View on GitHub,file-menu-sep,Edit in browser,Edit in VS Code' \
            'slides\.pdf:View on GitHub,file-menu-sep,Edit in browser,Edit in VS Code' \
            'Lab_Session_1\.ipynb:View on GitHub,file-menu-sep,Edit in browser,Edit in VS Code'; do
            f=${want%%:*}
            got=$(items "$f" | head -1)
            if [ "$got" != "${want#*:}" ]; then
              echo "::error::$f's menu lists [$got], not [${want#*:}]"
              missing=1
            fi
          done
          if [ "$(menu 'slides\.pdf' | head -1 | grep -o 'data-edit="[a-z]*"><span class="file-menu-lbl" role="link" aria-disabled="true">' | wc -l)" -ne 2 ] \
            || [ "$(menu 'slides\.pdf' | head -1 | grep -o '<small>not an editable format</small>' | wc -l)" -ne 2 ]; then
            echo "::error::slides.pdf's Edit rows are not both greyed as not an editable format"
            missing=1
          fi
          if ! menu 'Lab_Session_1\.ipynb' | head -1 | grep -q 'data-edit="online"><span class="file-menu-lbl" role="link" aria-disabled="true">.*<small>set up in <a[^>]*href="[^"]*/profile/">Profile</a></small>.*data-edit="local"><span class="file-menu-lbl" role="link" aria-disabled="true">.*<small>set up in <a[^>]*href="[^"]*/profile/">Profile</a></small>'; then
            echo "::error::Lab_Session_1.ipynb's Edit rows are not there for the script to enable"
            missing=1
          fi
          # Every row in a file's menu leaves the page, so every one of them leaves in a
          # new tab, and so does the Profile link in a greyed row's reason; a greyed row
          # itself is no link at all. The script's live Edit rows are not checked here. One menu
          # at a time (non-greedy): a kind tab renders a row's files on one line, and the
          # row names between the menus open in place.
          if grep -rh 'file-menu-list' . | perl -ne 'print "$1\n" while m{(<ul class="file-menu-list">.*?</ul>)}g' | grep -o '<a [^>]*>' | grep -v 'target="_blank"'; then
            echo "::error::a file-menu item was rendered without target=_blank"
            missing=1
          fi
          exit $missing

      - name: Check the open-in-your-own-copy control ships
        # There is no JS runtime in this job, so what is checked here is what Liquid
        # RENDERED: the page the tab points at exists, the set-up line reaches a file list
        # and an assignment, and the assignment's repo shape reaches the script as a data
        # attribute rather than as prose. The Liquid-error check above covers the script's
        # own markup.
        run: |
          cd "$RUNNER_TEMP/build"
          missing=0
          grep -q 'id="dsl-profile"' profile/index.html || {
            echo "::error::/profile/ built without its form"; missing=1; }
          for step in 1 2 3 4; do
            grep -q "profile-step-num\">$step<" profile/index.html || {
              echo "::error::/profile/ built without step $step"; missing=1; }
          done
          for field in handle materials assignments editor; do
            grep -q "data-save=\"$field\"" profile/index.html || {
              echo "::error::/profile/ built without a Save for $field"; missing=1; }
            grep -q "id=\"dsl-saved-$field\"" profile/index.html || {
              echo "::error::/profile/ built without a saved line for $field"; missing=1; }
          done
          # Every place the assignment page prints the repo shape is marked for the script.
          for f in assignments/01-assignment-1.html; do
            test "$(grep -c 'code data-dsl-repo' "$f")" -gt 0 || {
              echo "::error::$f does not mark the repo shape"; missing=1; }
            test "$(grep -c 'data-dsl-repo-url' "$f")" -gt 0 || {
              echo "::error::$f does not mark the repo link"; missing=1; }
          done
          for f in lectures/index.html assignments/01-assignment-1.html; do
            grep -q "Open files in your local copy" "$f" || {
              echo "::error::$f carries no set-up line"; missing=1; }
          done
          # The repo the semester releases into, never a hard-coded `materials`.
          grep -q 'data-materials-repo="course-materials"' profile/index.html || {
            echo "::error::/profile/ does not set up course-materials"; missing=1; }
          grep -q 'href="https://github.com/[^/"]*/course-materials/fork"' profile/index.html || {
            echo "::error::/profile/ does not fork course-materials"; missing=1; }
          if grep -q "Open files in your local copy" profile/index.html; then
            echo "::error::/profile/ offers to send the reader to /profile/"
            missing=1
          fi
          grep -q 'data-repo-name="assignment-1-&lt;your-handle&gt;"' assignments/01-assignment-1.html || {
            echo "::error::the assignment page does not hand the script its repo shape"; missing=1; }
          exit $missing

      - name: Check the Updates box announces only what released
        # The home page's box is sorted newest-first over the WHOLE term, so an unfiltered
        # one announces the last week of term as "New Lab is up" before week one has
        # happened - which is what two live semester sites showed all term. The fixture holds
        # a released lecture 2 beside an unreleased lecture 3, a silent readings row, an
        # undated off-plan lab, a TBC lab, and a handed-out assignment 1 beside a pending assignment
        # 2, so the box is checked in both directions.
        run: |
          box=$(sed -n '/<h2>Updates<\/h2>/,/<\/ul>/p' "$RUNNER_TEMP/build/index.html")
          printf '%s\n' "$box"
          missing=0
          for needle in "Lecture 1" "Lecture 2" "Lab 1" "Assignment 1"; do
            if ! printf '%s' "$box" | grep -qF -- "$needle"; then
              echo "::error::the Updates box does not announce $needle, which released"
              missing=1
            fi
          done
          for needle in "Lecture 3" "Attention, further" "Lab_Session_2" "Assignment 2" "Attention lab"; do
            if printf '%s' "$box" | grep -qF -- "$needle"; then
              echo "::error::the Updates box announces $needle, which has not released"
              missing=1
            fi
          done
          exit $missing

  jekyll-theme-seam:
    # The same fixture, built against the REAL theme at the ref `site_repo.THEME_REF`
    # pins - the one seam the offline job above stubs out. The course stylesheet used to
    # ship rules that only worked nested inside the theme's, so a theme release could
    # flatten every live schedule with both repos' own checks green.
    #
    # The pin is not repeated here: it is already in the `_config.yml` the fixture
    # generates, so this build reads whatever site_repo says today. Needs the network
    # (jekyll-remote-theme fetches the theme from codeload.github.com).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: tests/fixtures/site

      - name: Generate the fixture semester site
        run: python3 tests/fixtures/site/build_fixture.py "$RUNNER_TEMP/themed"

      - name: Drop the offline stand-ins the real theme supplies
        # A file in the site shadows the theme's copy, so leaving these in would build
        # against the stubs again and prove nothing.
        run: |
          rm -f "$RUNNER_TEMP/themed/_config.offline.yml"
          rm -f "$RUNNER_TEMP/themed/assets/css/main.scss"
          rm -f "$RUNNER_TEMP/themed"/_layouts/{default,page,post}.html
          grep "^remote_theme:" "$RUNNER_TEMP/themed/_config.yml"

      - name: Build it against the pinned theme
        working-directory: tests/fixtures/site
        # MUST match the Build step of templates/site/.github/workflows/deploy.yml, which
        # is the workflow every real site runs - anything extra here is help a live deploy
        # will not get, and this job is green on it while the site is down.
        # test_shipped_workflows.py holds the two to each other. BASE_PATH is the one
        # exception: an org root site's baseurl is empty and there is no Pages step here to
        # compute one.
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_REPO_NWO: ${{ github.repository }}
        run: |
          bundle exec jekyll build \
            --strict_front_matter \
            --config "$RUNNER_TEMP/themed/_config.yml" \
            --source "$RUNNER_TEMP/themed" \
            --destination "$RUNNER_TEMP/themed-build"

      - name: Check the course rules reached the compiled stylesheet
        # Whichever repo defines them, the compiled CSS must carry the schedule table's
        # layout, its row colours and the session blocks. True at the current pin (the
        # theme still defines the first two) and after a bump (templates/site/ does).
        run: |
          css="$RUNNER_TEMP/themed-build/assets/css/main.css"
          missing=0
          for needle in ".responsive-table" ".table-row-lecture" ".session-title"; do
            grep -qF -- "$needle" "$css" || { echo "::error::$needle is not in $css"; missing=1; }
          done
          exit $missing

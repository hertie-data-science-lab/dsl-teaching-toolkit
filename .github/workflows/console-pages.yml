name: console-pages

# Build the Instructor Console (console/) and publish it to GitHub Pages at
# https://hertie-data-science-lab.github.io/dsl-teaching-toolkit/, from main. The other
# branches are the current preview loops (decisions 0034, 0035); drop each once it has merged.
on:
  push:
    branches: [main, feature/readiness-0034, feature/student-console-feedback]
    paths: [console/**, .github/workflows/console-pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: console-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: console/.nvmrc
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm test
      # The GitHub App sign-in shows only when both are set; the relay's origin also goes
      # into the page's Content-Security-Policy. Empty variables build a token-only console.
      # GH_APP_SLUG names the App's install page; empty drops the install step.
      # TOOLKIT_REF is the branch built from: the catalogue reads that branch's orgs.yml
      # (main for a run on a tag).
      - run: npm run build
        env:
          VITE_GH_APP_CLIENT_ID: ${{ vars.GH_APP_CLIENT_ID }}
          VITE_AUTH_RELAY_URL: ${{ vars.AUTH_RELAY_URL }}
          VITE_GH_APP_SLUG: ${{ vars.GH_APP_SLUG }}
          VITE_TOOLKIT_REF: ${{ github.ref_type == 'branch' && github.ref_name || 'main' }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: console/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4

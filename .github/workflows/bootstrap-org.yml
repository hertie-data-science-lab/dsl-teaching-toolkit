name: Bootstrap Course Org

on:
  workflow_dispatch:
    inputs:
      org:
        description: "Course org to bootstrap (e.g. hertie-dsl-demo-course-e1234)"
        required: true
      org_name:
        description: "Display name for org profile (e.g. DSL Demo)"
        required: true
      course_code:
        description: "Course code (e.g. GRAD-E1234)."
        required: true
      set_secret:
        description: "Set the DSL_BOT_TOKEN org secret automatically (recommended; uncheck only to set it by hand)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      admin:
        description: "Course admin GitHub handle(s), comma-separated"
        required: false
        default: ""

# Every step here authenticates with DSL_BOT_TOKEN (org creation and team lookups are far
# beyond anything the ambient token could do); the bootstrap job re-declares contents: read
# for its checkout.
permissions: {}

jobs:
  check-team:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify triggering user is in a provisioning team
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          for team in faculty instructors admin; do
            code=$(gh api "orgs/hertie-data-science-lab/teams/$team/memberships/$ACTOR" \
                     --jq '.state' 2>/dev/null || true)
            if [ "$code" = "active" ]; then exit 0; fi
          done
          echo "::error::$ACTOR is not in the faculty, instructors or admin team - access denied"
          exit 1

  bootstrap:
    name: Bootstrap ${{ inputs.org }}
    needs: check-team
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Bootstrap course org
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          DSL_BOT_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          # Mail transport for enrolment-code / grade emails, held once here on the
          # central repo (one shared no-reply mailbox) and propagated onto the course org
          # by --propagate-secret. Unset ones arrive as empty strings and are skipped.
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_SENDER: ${{ secrets.GRAPH_SENDER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SET_SECRET: ${{ inputs.set_secret }}
          ADMIN: ${{ inputs.admin }}
          ORG: ${{ inputs.org }}
          ORG_NAME: ${{ inputs.org_name }}
          COURSE_CODE: ${{ inputs.course_code }}
        run: |
          args=(--org "$ORG"
                --org-name "$ORG_NAME"
                --course-code "$COURSE_CODE")
          [ "$SET_SECRET" = "true" ] && args+=(--propagate-secret)
          [ -n "$ADMIN" ] && args+=(--admins "$ADMIN")
          python3 -m dsl_course.bootstrap_course "${args[@]}"

name: Bootstrap Course Org

on:
  workflow_dispatch:
    inputs:
      org:
        description: "Course org to bootstrap (e.g. hertie-dsl-demo-course-e1234)"
        required: true
      org_name:
        description: "Display name for org profile (e.g. DSL Demo)"
        required: true
      course_code:
        description: "Course code (e.g. GRAD-E1234)."
        required: true
      set_secret:
        description: "Set the DSL_BOT_TOKEN org secret automatically (recommended; uncheck only to set it by hand)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      admin:
        description: "Course admin GitHub handle(s), comma-separated"
        required: false
        default: ""
      central_ref:
        # `main` is not offered: it is the dev tier, and an org bootstrapped onto it would
        # run every merge as production from the moment it landed. A soak goes on staging.
        description: "Toolkit tier the new org runs (and that this run bootstraps it with)"
        required: true
        type: choice
        default: "release"
        options:
          - release
          - staging

# Every step here authenticates with DSL_BOT_TOKEN (org creation and team lookups are far
# beyond anything the ambient token could do); the bootstrap job re-declares contents: read
# for its checkout.
permissions: {}

jobs:
  check-team:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify triggering user is in a provisioning team
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          for team in faculty instructors admin; do
            code=$(gh api "orgs/hertie-data-science-lab/teams/$team/memberships/$ACTOR" \
                     --jq '.state' 2>/dev/null || true)
            if [ "$code" = "active" ]; then exit 0; fi
          done
          echo "::error::$ACTOR is not in the faculty, instructors or admin team - access denied"
          exit 1

  bootstrap:
    name: Bootstrap ${{ inputs.org }}
    needs: check-team
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # THAT tier's code, not main's. The org's own workflows are rendered at
      # `central_ref` and every one of them checks the toolkit out there at run time, so
      # bootstrapping from main would provision the org with dev code and then hand it
      # release workflows - two different engines, and only one of them ever tested
      # against the files this run writes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.central_ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Bootstrap course org
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          DSL_BOT_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          SET_SECRET: ${{ inputs.set_secret }}
          ADMIN: ${{ inputs.admin }}
          ORG: ${{ inputs.org }}
          ORG_NAME: ${{ inputs.org_name }}
          COURSE_CODE: ${{ inputs.course_code }}
          CENTRAL_REF: ${{ inputs.central_ref }}
        run: |
          # Recorded in the org's own dsl-course.yml, so the tier this run checked out is
          # the tier the org keeps running once the nightly refresh takes over.
          args=(--org "$ORG"
                --org-name "$ORG_NAME"
                --course-code "$COURSE_CODE"
                --central-ref "$CENTRAL_REF")
          [ "$SET_SECRET" = "true" ] && args+=(--propagate-secret)
          [ -n "$ADMIN" ] && args+=(--admins "$ADMIN")
          python3 -m dsl_course.bootstrap_course "${args[@]}"

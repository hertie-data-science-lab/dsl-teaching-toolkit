name: Promote to release

# Move the `release` tier forward. `release` is what every real org runs (the default in
# dsl_course/central.py, and each org's own `central_ref:`); `main` is the trunk, and what
# the demo course org runs - so whatever is promoted here has already been live in a real
# org since it merged.
#
# `release` carries no commits of its own: it is always a FAST-FORWARD of `main`. That
# invariant is enforced here, not by convention: the promoted commit must be on main's
# history, and it must be a descendant of `release`'s current tip. So this workflow can
# only ever move `release` forward along main - it cannot rewrite its history, and there is
# therefore no way to use it to ship something main has never seen.
#
# Rollback is a `git revert` on main, promoted forward; pinning one org to the last good SHA
# is the way to move faster than that (see docs-admin-arch/central-admin.md).
#
# Who can run it: dispatching a workflow needs write on this repo, which is the same gate
# every seeded workflow in every org uses. There is no approval gate on top of that - the
# demo course org has been running this code off `main` since it merged, which is where the
# confidence to press this comes from.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "What to promote (default: main's tip). A branch, tag or full SHA on main's history - everything up to it ships."
        required: false
        default: "main"
        type: string
      refresh_orgs:
        description: "Refresh every org on `release` now, rather than waiting for tonight's cron"
        required: false
        default: true
        type: boolean

# The push authenticates as a repo-scoped deploy key and the fan-out as the bot, so
# neither job needs anything from the ambient token beyond reading this repo.
permissions: {}

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      # The commit the tier now points at - what the fan-out below must run.
      sha: ${{ steps.fast-forward.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          # The push below is the DEPLOY KEY's, not GITHUB_TOKEN's: the tier branches carry
          # a ruleset whose only bypass actor is "deploy keys", which no account and no
          # Actions token can be - so this workflow is the one way a tier moves. Checkout's
          # own credentials would win over the key (it writes an auth header into the repo
          # config, and https beats the ssh remote set below), so they are not persisted.
          persist-credentials: false

      - name: Fast-forward the tier, or refuse
        id: fast-forward
        env:
          PROMOTE_DEPLOY_KEY: ${{ secrets.PROMOTE_DEPLOY_KEY }}
          # `gh api meta` is a public, unauthenticated endpoint; gh just wants a token.
          GH_TOKEN: ${{ github.token }}
          # The one tier this workflow moves. `main` is not promoted to - it is where
          # promotions come FROM.
          TIER: release
          SOURCE_INPUT: ${{ inputs.ref }}
        run: |
          set -eo pipefail
          git config user.name "DSL Bot"
          git config user.email "dsl-bot@hertie-school.org"
          # The key lives in the agent for this step only - never on disk, and never in a
          # remote URL or in argv where a failed push would echo it into the log. The host
          # keys are GitHub's own published set, not whatever answers on the night, so a
          # substituted github.com fails the push instead of receiving it.
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          gh api meta --jq '.ssh_keys[]' | sed 's/^/github.com /' >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          printf '%s\n' "$PROMOTE_DEPLOY_KEY" | ssh-add -
          git remote set-url origin "git@github.com:$GITHUB_REPOSITORY.git"
          # fetch-depth: 0 already brings every branch and tag, so origin/main and both
          # tier tips are here before this runs. Re-fetched anyway: one cheap call, and it
          # narrows the window between the tip read below and the lease it becomes.
          git fetch --quiet origin "+refs/heads/*:refs/remotes/origin/*"

          # main's tip by default. Overridable, to promote a point on main short of it -
          # `release` is a fast-forward, so this chooses HOW FAR up main to move, never
          # which commits to take: naming a commit ships it and everything before it.
          source="${SOURCE_INPUT:-main}"

          # A branch name resolves through origin/; a tag or SHA does not.
          new=$(git rev-parse --verify --quiet "refs/remotes/origin/$source^{commit}" \
                || git rev-parse --verify --quiet "$source^{commit}" || true)
          if [ -z "$new" ]; then
            echo "::error::'$source' is not a commit in this repository."
            exit 1
          fi

          # THE invariant: every tier is a fast-forward of main. Enforced before the tier
          # check, because a commit off main's history is the more serious mistake - it
          # would put code into production that main, and therefore CI and review, never saw.
          if ! git merge-base --is-ancestor "$new" origin/main; then
            echo "::error::$source ($new) is not on main's history. Every tier is a fast-forward of main - land the change on main first (a rollback is a revert on main), then promote it."
            exit 1
          fi

          tip=$(git rev-parse --verify --quiet "refs/remotes/origin/$TIER^{commit}" || true)
          if [ -n "$tip" ] && ! git merge-base --is-ancestor "$tip" "$new"; then
            echo "::error::$source ($new) is not a descendant of $TIER ($tip), so promoting it would REWRITE the tier. To undo what is on $TIER, revert it on main and promote the revert forward."
            echo "Commits on $TIER that $source does not contain:"
            git --no-pager log --oneline "$new..$tip"
            exit 1
          fi

          # --force-with-lease, never a bare -f: the lease is the tip verified above (empty
          # when the branch does not exist yet, which asserts exactly that), so a tier moved
          # by someone else since aborts the run rather than being overwritten. The push is
          # a fast-forward either way - the lease only closes the gap between the check and
          # the push.
          git push --force-with-lease="refs/heads/$TIER:$tip" origin "$new:refs/heads/$TIER"
          echo "sha=$new" >> "$GITHUB_OUTPUT"

          {
            echo "## Promoted \`$source\` to \`$TIER\`"
            echo
            echo "- from: \`${tip:-(new branch)}\`"
            echo "- to:   \`$new\`"
            echo
            if [ -n "$tip" ] && [ "$tip" != "$new" ]; then
              echo "### Commits this puts on \`$TIER\`"
              echo
              echo '```'
              git --no-pager log --oneline "$tip..$new"
              echo '```'
            elif [ "$tip" = "$new" ]; then
              echo "_Already there - nothing moved._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # A promotion changes nothing in an org until that org next re-renders its workflows,
  # which the nightly "Refresh actions" cron does within 24h. This runs it now, so a
  # promotion is a deploy rather than a deploy that happens overnight.
  #
  # The same fan-out a merge to main runs for the orgs on `main`; only the tier differs.
  refresh-orgs:
    needs: promote
    if: ${{ inputs.refresh_orgs }}
    permissions:
      contents: read
    uses: ./.github/workflows/refresh-tier.yml
    with:
      tier: release
      ref: ${{ needs.promote.outputs.sha }}
    secrets:
      DSL_BOT_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}

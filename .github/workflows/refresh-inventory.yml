name: Refresh Course Orgs Inventory

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays at 06:00 UTC
  workflow_dispatch:
    inputs:
      allow_net_deletion:
        description: "Let the refresh land even though it removes more rows than it adds (an org really was deleted)"
        type: boolean
        default: false

# The PR steps need contents + pull-requests write; nothing else does. Declared at the job
# below, so the workflow default is nothing at all.
permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      # To report the `pytest` result this job runs itself - main requires that check and
      # a GITHUB_TOKEN-authored PR can never be sent one (see the merge step).
      statuses: write
    # Declared once, at the job: two steps prepare and push the SAME branch, and a drift
    # between two copies would prepare one branch and push another.
    env:
      BRANCH: chore/refresh-inventory
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      # Dev requirements too: the merge step runs `pytest` itself, because main requires
      # that check and a GITHUB_TOKEN-authored PR can never be sent one.
      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # The branch is prepared BEFORE the inventory is generated, so the file is written on
      # top of whatever the branch already holds rather than on top of main.
      - name: Prepare the inventory branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          git config user.name "DSL Bot"
          git config user.email "dsl-bot@hertie-school.org"
          # Fetch the shared branch if it exists, so the push below has a lease to check
          # against - and so a reuse starts from its real tip.
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null || true
          # Build ON the branch only while a PR is open on it: that PR may carry a reviewer's
          # commit, and rebuilding from main would discard it with no trace (the old
          # `checkout -B` + `push -f` did exactly that). With no open PR the branch is spent -
          # it is kept after the squash-merge - so start again from main rather than
          # re-proposing an already-merged commit.
          if gh pr view "$BRANCH" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -B "$BRANCH"
          fi

      # Reading ACROSS orgs is the bot's job - it is a member of every course org, and
      # GITHUB_TOKEN sees only this repo.
      - name: Regenerate bootstrapped-orgs-inventory.md
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
        run: |
          python3 -m dsl_course.list_orgs \
            --update-file bootstrapped-orgs-inventory.md

      # Writing to THIS repo is the reverse: the bot holds only `read` here, so it can
      # neither merge nor (reliably) open a PR. GITHUB_TOKEN carries the contents +
      # pull-requests write granted above, which is exactly the scope this step needs.
      - name: Open PR if the inventory changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_NET_DELETION: ${{ inputs.allow_net_deletion }}
        run: |
          set -eo pipefail
          # An OPEN PR whose branch already carries this exact inventory has nothing new
          # to commit - but it still has to MERGE: its required `pytest` status was never
          # posted (the PR predates this step, or the earlier run died before posting), so
          # it sits blocked for ever. Skip the commit and push, run the check, merge.
          pr_open=false
          if gh pr view "$BRANCH" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            pr_open=true
          fi
          if git diff --quiet bootstrapped-orgs-inventory.md; then
            if [ "$pr_open" != true ]; then
              echo "No changes to inventory - nothing to do."
              exit 0
            fi
            echo "Inventory unchanged, but PR $BRANCH is open and unmerged - verifying and merging it."
          else

            # This page is fully generated and merged unattended, so a refresh that DROPS more
            # rows than it adds must not land on its own: that is the signature of a partial
            # discovery pass (a rate-limited search, a token that lost an org) rather than of
            # orgs genuinely going away. Stop red and let a human look - then let them say so,
            # via the allow_net_deletion dispatch input, rather than editing the page by hand.
            added=$(git diff --numstat -- bootstrapped-orgs-inventory.md | cut -f1)
            removed=$(git diff --numstat -- bootstrapped-orgs-inventory.md | cut -f2)
            if [ "${removed:-0}" -gt "${added:-0}" ] && [ "$ALLOW_NET_DELETION" != "true" ]; then
              echo "::error::inventory refresh would remove $removed line(s) and add only $added. Either an org really was deleted - re-run this workflow manually with allow_net_deletion=true to let it land - or DSL_BOT_TOKEN lost access to an org it used to see (check its org memberships/grants), in which case the missing rows are still real and must NOT be merged away."
              git --no-pager diff -- bootstrapped-orgs-inventory.md
              exit 1
            fi

            git add bootstrapped-orgs-inventory.md
            git commit -m "chore: refresh course-orgs inventory"
            # --force-with-lease, never a bare -f: the lease is the tip fetched above (empty
            # when the branch does not exist yet, which asserts exactly that), so a commit
            # pushed to the branch since then aborts the run instead of being overwritten.
            lease=$(git rev-parse --verify --quiet "refs/remotes/origin/$BRANCH" || true)
            git push --force-with-lease="$BRANCH:$lease" origin "HEAD:$BRANCH"

            if ! gh pr view "$BRANCH" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
              gh pr create \
                --title "chore: refresh course-orgs inventory" \
                --body "Automated refresh by \`refresh-inventory\`. Course orgs discovered via topic \`dsl-course-hub\`, cohort orgs via \`dsl-cohort\`." \
                --base main --head "$BRANCH"
            fi
          fi
          # main requires the `pytest` check, and this PR can never receive one: GitHub does
          # not trigger workflows from events made with GITHUB_TOKEN, so ci.yml's
          # `pull_request` never fires on a PR this workflow opened (`app/github-actions` is
          # its author). This step used to wait for that check in a retry loop - twelve
          # rounds of "no checks reported", then a `gh pr checks --fail-fast` that gh
          # rejects outright without `--watch`. So the run went red, the PR stayed open, and
          # the inventory drifted for weeks. It was read as a race with CI; it is not a
          # race, it is a rule.
          #
          # So run the required check HERE and report it. The tests really do run - what
          # GitHub withholds is the trigger, not the verification - and reporting the result
          # under the `pytest` context is what lets branch protection see it. Never `|| true`
          # on either: an inventory that cannot merge is a broken refresh, and the verdict
          # belongs on this run.
          python3 -m pytest -q
          gh api "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" \
            -f state=success -f context=pytest \
            -f description="run by the inventory refresh (see this workflow)" >/dev/null
          gh pr merge "$BRANCH" --squash --delete-branch=false

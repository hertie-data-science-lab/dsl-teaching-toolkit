name: Refresh Course Orgs Inventory

# The live estate - every course org, the toolkit tier it runs, and the cohort orgs under
# it - rendered into this run's job summary. It is a REPORT, not a committed page: the
# self-merging PR it used to open needed write on `main` and left the page stale for weeks
# whenever the merge was refused.

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays at 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Reading ACROSS orgs is the bot's job - it is a member of every course org, and
      # GITHUB_TOKEN sees only this repo. list_orgs exits non-zero when it could not read
      # some org's metadata, which reds the run while still printing what it did see.
      - name: Render the inventory into the job summary
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
        run: |
          set -eo pipefail
          {
            echo "## Bootstrapped orgs"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -m dsl_course.list_orgs --format markdown >> "$GITHUB_STEP_SUMMARY"

# The institution file the toolkit ships: what happens when nobody said otherwise.
#
# Read by `dsl_course.policy`. An institution changes it with an `institution.yml` at the
# root of the toolkit repo (read at the org's `toolkit_version_ref`, like the engine):
# `institution` and `defaults` merge key by key over this file; `kinds`, `selection_floor`
# and `licences` replace it whole. These are the Hertie School's values.

institution:
  name: Hertie School
  url: https://hertie-school.org/en/datasciencelab
  dsl_org_url: https://github.com/hertie-data-science-lab
  # The student and instructor console; a semester site's banner links a reader there.
  console_url: https://hertie-data-science-lab.github.io/dsl-teaching-toolkit/
  # Escalation order: the first gets every fault no course admin or maintainer address
  # takes, and is the open site's contact when a course names none.
  contacts:
    - h.baker@hertie-school.org
    # - datasciencelab@hertie-school.org
  address: |
    Data Science Lab
    Hertie School
    Friedrichstraße 180
    10117 Berlin, Germany

# The bottom of the cascade: entry > semester.yml > course.yml > this, per key. A course
# and a semester write the same keys in their own `defaults:`.
defaults:
  timezone: Europe/Berlin       # a semester's schedule.yml `timezone:` when it names none
  late_window_days: 10          # 0 = nothing after the due date is accepted
  late_penalty_per_day: 10%     # of the earned grade, per day started
  max_team_size: 5
  assignment_repo_visibility: private   # private | public | student_choice: the repos students work in
  archive_grace_days: 60        # archive date = semester_end + this, unless the schedule sets one
  materials_repo: materials     # where a release lands when its entry names no repo
  marks_per_question: true      # returned marks show each question's mark and feedback
  # team_formation is not an institutional matter: set it in course.yml, semester.yml or
  # on the assignment.

# Schedule row kinds, in display order: the only kind vocabulary the engine and the console
# know. `plural` is the kind's block and tab name (`/lectures/`, Lectures); `numbered` says
# its entries are numbered (Lecture 3); `shown: false` = released, never a row or a tab
# (default true). `colour` is the row's label, `background` its row (both clear 4.5:1).
# `system: true` = the engine creates the row (the kind may be relabelled or recoloured,
# never removed); `other` is where an unknown kind lands.
kinds:
  - key: lecture
    plural: lectures
    numbered: true
    label: Lecture
    colour: "#a94442"
    background: "#f2dede"
    system: false
  - key: lab
    plural: labs
    numbered: true
    label: Lab
    colour: "#3c763d"
    background: "#dff0d8"
    system: false
  - key: readings
    plural: readings
    numbered: false
    label: Readings
    colour: "#2b6a60"
    background: "#dcefec"
    system: false
  - key: exam
    plural: exams
    numbered: false
    label: Exam
    colour: "#2b2f36"
    background: "#e6e8ec"
    system: false
  - key: assignment
    plural: assignments
    numbered: true
    label: Assignment
    colour: "#1f5fa8"
    background: "#d6e6f7"
    system: true
  - key: semester
    plural: semesters
    numbered: false
    label: Semester
    colour: "#7b3fb8"
    background: "#ead9f6"
    system: true
  - key: archive
    plural: archives
    numbered: false
    label: Archive
    colour: "#7d6230"
    background: "#fbf2d5"
    system: true
  - key: drop-in
    plural: drop-ins
    numbered: true
    label: Drop-in
    colour: "#8f4a1c"
    background: "#fbe3d6"
    system: false
  # Supporting files (data, images, code): released with everything else, never a row or a
  # tab on the student site or the public website (decision 0026 rule 3).
  - key: assets
    plural: assets
    numbered: false
    shown: false
    label: Supporting files
    colour: "#4a5560"
    background: "#eceff1"
    system: false
  - key: other
    plural: events
    numbered: false
    label: Event
    colour: "#7d6230"
    background: "#fbf2d5"
    system: false

# Hard limits no course or semester can override. Hertie: none.
selection_floor: {}

# The licences an open site may carry; the first is the default.
licences:
  - name: CC BY-NC-SA 4.0
    url: "https://creativecommons.org/licenses/by-nc-sa/4.0/"
  - name: CC BY 4.0
    url: "https://creativecommons.org/licenses/by/4.0/"
  - name: CC BY-SA 4.0
    url: "https://creativecommons.org/licenses/by-sa/4.0/"
  - name: All rights reserved
    url: ""

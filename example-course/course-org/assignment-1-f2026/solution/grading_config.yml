# INSTRUCTOR-OWNED - defines the assignment. Dates live in the semester's schedule.yml.
title: Linear regression      # the assignment's name, shown to graders and on the site
type: individual              # individual | group
submit_via: external          # assignment_repo (push to their repo) | external (handed in elsewhere) | shared_dropbox_repo (one drop-box repo for the whole semester)
formats: [py]                 # ipynb | py | rmd | qmd | latex | none - the starter stubs; the first is the runnable one

# questions:                  # OPTIONAL - the score skeleton, and the maximum shown beside
#   Q1: 15                    # each blank in the grading sheet. The total is their sum;
#   Q2: 10                    # there is no other total anywhere.
#   Q3: {points: 5, file: starter.tex}   # marked from another starter than the first

autograde: false              # true: run tests/ at the cutoff and show the count to graders
grader_pdf: false             # nothing is collected from GitHub here, so there is nothing to filter

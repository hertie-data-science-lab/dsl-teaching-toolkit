# INSTRUCTOR-OWNED - defines the assignment. Dates live in the cohort's schedule.yml.
title: Gradient descent       # the assignment's name, shown to graders and on the site
type: individual              # individual | group
# team_formation: self_select # group only: self_select (Join-team form) | assigned (teams.csv)
# max_team_size: 5            # group only
submit_via: assignment_repo   # assignment_repo (push to their repo) | external (handed in elsewhere) | shared_dropbox_repo (one drop-box repo for the whole cohort)
visibility: private           # private | public | student_choice - who may read it
format: ipynb                 # ipynb | py | rmd | qmd | latex | none - the starter stub only

# questions:                  # OPTIONAL - the score skeleton, and the maximum shown beside
#   Q1: 15                    # each blank in the grading sheet. The total is their sum;
#   Q2: 10                    # there is no `points:` field anywhere.

late_window_days: 7           # 0 or absent = nothing after the due date is accepted
late_penalty_per_day: 10%     # of the EARNED grade, per day started

autograde: true               # runs the hidden tests below at the cutoff
tests: tests                  # where they live on THIS solution branch
completion_check: true        # also runs the notebook itself; info.completion says how it went
grader_pdf: false             # the hidden tests do the reading; no question fences in this one

# INSTRUCTOR-OWNED - defines the assignment. Dates live in the cohort's schedule.yml.
title: Group project          # the assignment's name, shown to graders and on the site
type: group                   # individual | group
team_formation: self_select   # self_select (students use the Join-team form) | assigned
max_team_size: 4              # group only
submit_via: github            # github | external (Moodle, Kaggle, in class...)
format: py                    # ipynb | py | rmd | qmd | latex | none - the starter stub only

questions:                    # the score skeleton, and the maximum shown beside each blank
  Q1: 15
  Q2: 15
  Q3: 10
  Q4: 10

late_window_days: 7           # 0 or absent = nothing after the due date is accepted
late_penalty_per_day: 10%     # of the EARNED grade, per day started

autograde: false              # hand-marked, so no tests/ is seeded on the solution branch
completion_check: false       # not a notebook assignment; the default for `format: py`

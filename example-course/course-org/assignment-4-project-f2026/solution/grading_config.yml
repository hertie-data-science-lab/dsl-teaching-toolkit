# INSTRUCTOR-OWNED - defines the assignment. Dates live in the semester's schedule.yml.
title: Group project          # the assignment's name, shown to graders and on the site
type: group                   # individual | group
team_formation: self_select   # self_select (students use the Join-team form) | assigned
max_team_size: 4              # group only
submit_via: assignment_repo   # assignment_repo (push to their repo) | external (handed in elsewhere) | shared_dropbox_repo, below
# submit_via: shared_dropbox_repo # one private <slug>-submissions repo for the whole semester,
                              # a folder per team inside it, everyone able to read everyone
visibility: private           # private | public | student_choice - who may read it
format: py                    # ipynb | py | rmd | qmd | latex | none - the starter stub only

questions:                    # the score skeleton, and the maximum shown beside each blank
  Q1: 15
  Q2: 15
  Q3: 10
  Q4: 10

late_window_days: 10          # 0 = nothing after the due date is accepted
late_penalty_per_day: 10%     # of the EARNED grade, per day started

autograde: false              # hand-marked, so no tests/ is seeded on the solution branch
completion_check: false       # not a notebook assignment; the default for `format: py`
grader_pdf: true              # hand-marked: archive each team's fenced questions for the graders

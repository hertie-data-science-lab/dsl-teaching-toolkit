# How this assignment is defined and marked. Dates live in the cohort's schedule.yml.
title: Group project
type: group           # individual (one repo per student) or group (one repo per team)
autograde: false      # true -> run the hidden tests at the cutoff (needs `tests:` below)
tests: tests          # path (on THIS solution branch) holding the hidden tests

questions:            # optional: the score skeleton, and the maxima shown beside it
  Q1: 15
  Q2: 15
  Q3: 10
  Q4: 10

late_window_days: 7        # 0 = nothing after the due date is accepted
late_penalty_per_day: 10%  # of the EARNED grade, per day started

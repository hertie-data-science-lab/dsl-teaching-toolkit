org: hertie-dsl-demo-course-e1234
org_name: DSL Demo Course
course_name: Deep Learning (Demo)
course_code: E1234
course_description: A demo course - the blurb every cohort site shows under the title.

# course_admins is the SSOT for course-wide GitHub admin access (applied here AND
# mirrored into every cohort org's own course-admin team by sync_faculty).
# instructors/teaching_assistants below are DISPLAY ONLY at this level - website
# cards (institutional headshots + bio links), not access. Their real, per-cohort
# push access is declared in the cohort's own classroom-config/people.yml instead
# (see ../cohort-org/people.yml) - most cohorts have different lecturers/TAs, so
# that's where it's actually reconciled.
#
# `photo` takes EITHER an absolute URL on a host that ALLOWS HOTLINKING, OR a
# site-relative path to an image committed into the site repo under `_images/pp/`
# (that dir is served - `include: ['_images']` - and no sync ever rewrites it).
# Many institutional sites, hertie-school.org among them, return 403 to requests
# from outside the site, which renders as a broken image; host those locally.
# One of each mechanism is shown below.
# DEMO DATA: the `demo-*-placeholder` handles are deliberately NON-EXISTENT GitHub
# accounts, so copying this dataset never sends anyone an org invitation. The cards
# still carry real names/photos/links - a card is built from this file, not from
# GitHub. Swap in real handles to actually grant access (a handle that does not
# exist is logged as a warning and skipped, so the sync still completes).
people:
  course_admins:
    # Course-wide admin, mirrored into every cohort. Optional start/end bound it -
    # here, the course director's tenure running this course.
    - github_handle: "demo-lkaack-placeholder"
      start: "2026-08-01"
      end: "2027-07-31"
  instructors:
    - github_handle: "demo-lkaack-placeholder"
      name: "Prof. Lynn Kaack, PhD"
      title: "Assistant Professor of Computer Science and Public Policy"
      photo: "https://github.com/LynnKaack.png"   # remote URL (GitHub avatars always hotlink)
      url: "https://www.hertie-school.org/de/research/faculty-and-researchers/profile/person/kaack"
      start: "2026-08-01"
      end: "2027-07-31"
  # NB: the public course site renders INSTRUCTOR cards only (`include_tas=False` in
  # site.sync_public_site) - TAs are cohort-scoped, so their cards come from the
  # cohort's own classroom-config/people.yml (../cohort-org/people.yml). The two
  # entries below are therefore inert here; they are kept only to show the key is
  # accepted and to keep the two files' shapes comparable.
  teaching_assistants:
    - github_handle: "demo-cfusarbassini-placeholder"
      start: "2026-08-01"
      end: "2027-01-31"
      name: "Chiara Fusar Bassini"
      title: "PhD candidate, Data Science Lab"
      photo: "https://github.com/chiara-fb.png"
      url: "https://www.hertie-school.org/en/who-we-are/profile/person/fusar-bassini"
    - github_handle: "demo-henrycgbaker-placeholder"
      start: "2026-08-01"
      end: "2027-01-31"
      name: "Henry Baker"
      title: "Research Engineer & Data Scientist"
      photo: "/_images/pp/henrycgbaker.jpg"   # the other form: local file in the site repo
      url: "https://www.hertie-school.org/en/who-we-are/profile/person/baker"

# The schedule (release calendar, due dates, exams) is cohort-specific - it lives in
# the COHORT org's classroom-config/schedule.yml instead, not here. See
# ../cohort-org/schedule.yml.

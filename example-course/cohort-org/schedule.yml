# Worked example for the hertie-dsl-demo-f2026 semester's whole term in one file. 
#
# - full schema: https://github.com/hertie-data-science-lab/dsl-teaching-toolkit/blob/main/docs/07-schedule-releases.md
# - see reference: https://github.com/hertie-dsl-demo-f2026/classroom-config/blob/main/schedule.yml
# - see deployed end-product: https://hertie-dsl-demo-f2026.github.io/schedule/
#
# this deliberately showcases a range of different fields for each entry, showing possible maximal vs minimal (i.e. relying on defaults) usage

timezone: Europe/Berlin
semester_start: 2026-09-07
semester_end: 2026-12-18

releases:
  course-intro:
    event_datetime: 2026-08-31T09:00
    show_on_site: false
    deploy:
      - course_source_repo: course-materials-f2026
        course_source_path: SYLLABUS.md
  readings-1:
    event_datetime: 2026-08-25T09:00
    show_on_site: false
    deploy:
      - course_source_repo: course-materials-f2026
        course_source_path: readings/01_week-1
  lecture-1:
    event_datetime: 2026-09-01T10:00
    title: Perceptrons and gradient descent
    details: >
      What a linear model can and cannot separate, and how gradient descent finds its
      weights.
    deploy:
      - course_source_repo: course-materials-f2026
        course_source_path: lectures/01_week-1
        deploy_datetime: 2026-09-01T09:00
      - course_source_repo: lecture-code-f2026
        course_source_path: mlpkg/core
  lab-1:
    event_datetime: 2026-09-03T14:00
    title: Your first classifier
    details: Build, train and score it end to end.
    deploy:
      - course_source_repo: course-materials-f2026
        course_source_path: labs/01_week-1
      - course_source_repo: course-materials-f2026
        course_source_path: solutions/labs/01_week-1
        semester_dest_path: labs/01_week-1/solutions
        deploy_datetime: 2026-09-03T18:00
  readings-2:
    event_datetime: 2026-09-01T09:00
    show_on_site: false
    deploy:
      - course_source_repo: course-materials-f2026
        course_source_path: readings/02_week-2
  lecture-2:
    event_datetime: 2026-09-08T10:00
    title: Backpropagation
    details: How a network computes its own gradients, and why the chain rule is the whole trick.
    deploy:
      - course_source_repo: course-materials-f2026
        course_source_path: lectures/02_week-2
        deploy_datetime: 2026-09-08T09:00
  lab-2:
    event_datetime: 2026-09-10T14:00
    details: Implement backprop by hand, then check it against the autograd version.
    deploy:
      - course_source_repo: course-materials-f2026
        course_source_path: labs/02_week-2
  readings-3:
    event_datetime: 2026-09-08T09:00
    show_on_site: false
    deploy:
      - course_source_repo: course-materials-f2026
        course_source_path: readings/03_week-3
  lecture-3:
    event_datetime: 2026-09-15T10:00
    details: Simulation as a way of testing what a model has actually learned.
    deploy:
      - course_source_repo: course-materials-f2026
        course_source_path: lectures/03_week-3
        deploy_datetime: 2026-09-15T09:00
      - course_source_repo: lecture-code-f2026
        course_source_path: mlpkg/simulation
  lab-3:
    event_datetime: 2026-09-17T14:00
    details: Run the simulation package against your week-2 model.
    deploy:
      - course_source_repo: course-materials-f2026
        course_source_path: labs/03_week-3
  readings-4:
    event_datetime: 2026-09-15T09:00
    show_on_site: false
    deploy:
      - course_source_repo: course-materials-f2026
        course_source_path: readings/04_week-4
  lecture-4:
    event_datetime: 2026-09-22T10:00
    details: Regularisation, and what overfitting looks like before the test set tells you.
    deploy:
      - course_source_repo: course-materials-f2026
        course_source_path: lectures/04_week-4
        deploy_datetime: 2026-09-22T09:00
  lab-4:
    event_datetime: 2026-09-24T14:00
    details: Tune one model three ways and argue for one of them.
    deploy:
      - course_source_repo: course-materials-f2026
        course_source_path: labs/04_week-4
  readings-5:
    event_datetime: 2026-09-22T09:00
    show_on_site: false
    deploy:
      - course_source_repo: course-materials-f2026
        course_source_path: readings/05_week-5
  lecture-5:
    event_datetime: 2026-09-29T10:00
    deploy:
      - course_source_repo: course-materials-f2026
        course_source_path: lectures/05_week-5
        deploy_datetime: 2026-09-29T09:00
      - course_source_repo: lecture-code-f2026
        course_source_path: mlpkg/training
  lab-5:
    event_datetime: 2026-10-01T14:00
    deploy:
      - course_source_repo: course-materials-f2026
        course_source_path: labs/05_week-5

assignments:                    
  assignment-1:
    title: Linear regression              # NB optional: the name, beside the slug on the site
    details: Closed form first, then by gradient descent.   # NB optional: the Details column of both its rows
    course_source_repo: assignment-1-f2026
    handout_datetime: 2026-09-15T14:00  
    due_datetime: 2026-10-13
    grading_datetime: 2026-10-15
    solution_datetime: 2026-10-16T09:00
  assignment-2:
    course_source_repo: assignment-2-f2026
    details: Classification on a dataset you have not seen, scored on held-out data.
    semester_dest_repo: homework-2
    handout_datetime: 2026-09-29T14:00
    due_datetime: 2026-10-27T23:59
  assignment-4-project:
    title: Group project                  # NB if empty, the template README's heading is used
    details: Four weeks, one question of your own choosing, one write-up between you.
    course_source_repo: assignment-4-project-f2026
    handout_datetime: 2026-10-13T14:00
    due_datetime: 2026-11-15T23:59
    # NB no `type: group` and no `max_team_size: 4` here - this file is timing only. Both
    # live in this assignment's own grading_config.yml, on the course template's solution
    # branch (../course-org/assignment-4-project-f2026/solution/grading_config.yml)

events:
  mid-term:
    type: exam
    title: MidTerm Exam                   # NB if empty, default -> would display as this anyway
    details: Ninety minutes, closed book. Everything up to and including week 5.
    event_datetime: tbc
  final-exam:
    type: exam
    title: Final Exam                     # NB if empty, default -> would display as this anyway
    details: Two hours, closed book. Room confirmed nearer the time.
    event_datetime: 2026-12-15T14:00   
    tbc: true
  project-clinic:
    title: Project clinic
    details: Drop-in, room xyz. Bring a laptop and whatever is not working.
    event_datetime: 2026-11-10T10:00
  guest-lecture:
    title: Guest lecture
    details: An industry speaker - announced nearer the time.
    event_datetime: tbc

# archive the org (freezes in place): removes all write permissions, retains all read permissions
archive:
  event_datetime: 2027-02-16  # optional (default: semester_end + 60 days)
  title: Semester archived      # optional - the row's Title column
  show_on_site: true          # a "Semester archived" row on the site's Schedule tab, also sends a notice email 14 days out
  details: >-                 # optional, `{date}` is filled in automatically
    This semester is archived on {date}: every repository in it becomes read-only. You keep read access, so you can still fork or clone anything you want to keep working on into your own account.

# A worked example of a semester's semester-config/semester.yml (decision 0039). The
# skeleton to edit is seeded beside the schedule; the two `photo` forms are shown below.

# Who delivers THIS semester: GitHub access, fault mail (`email`, required), and the
# student site's instructor cards.
people:
  - github_handle: "demo-lkaack-placeholder"
    role: instructor
    email: "l.kaack@example.org"
    name: "Prof. Lynn Kaack, PhD"
    title: "Assistant Professor of Computer Science and Public Policy"
    photo: "https://github.com/LynnKaack.png"
    url: "https://www.hertie-school.org/de/research/faculty-and-researchers/profile/person/kaack"
  - github_handle: "demo-cfusarbassini-placeholder"
    role: teaching_assistant
    email: "c.fusarbassini@example.org"
    name: "Chiara Fusar Bassini"
    title: "PhD candidate, Data Science Lab"
    photo: "https://github.com/chiara-fb.png"
    url: "https://www.hertie-school.org/en/who-we-are/profile/person/fusar-bassini"
    start: "2026-08-01"
    end: "2027-01-31"
  - github_handle: "demo-henrycgbaker-placeholder"
    role: teaching_assistant
    email: "h.baker@example.org"
    name: "Henry Baker"
    title: "Research Engineer & Data Scientist, Data Science Lab"
    photo: "/_images/pp/henrycgbaker.jpg"   # the other form: local file in the site repo
    url: "https://www.hertie-school.org/en/who-we-are/profile/person/baker"
    start: "2026-08-01"
    end: "2027-01-31"

defaults:   # every key present; uncomment to override. The comment shows the inherited value and its source.
  # timezone: Europe/Berlin                 (institution)
  late_window_days: 5
  late_penalty_per_day: 10%
  # max_team_size: 4                        (course)
  # assignment_repo_visibility: private     (institution)
  # archive_grace_days: 60                  (institution)
  # materials_repo: materials               (institution)
  # marks_per_question: true                (institution)
  # team_formation: self_select             (course)

student_site:
  syllabus: SYLLABUS.md

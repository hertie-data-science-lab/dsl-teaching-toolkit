        from_path: lectures/02_week-2
        release_datetime: 2026-09-08T09:00
  lecture-3:
    session: 3
    details: Simulation as a way of testing what a model has actually learned.
    event_datetime: 2026-09-15T10:00
    files:
      - from_course_repo: course-materials-f2026
        from_path: lectures/03_week-3
        release_datetime: 2026-09-15T09:00
      - from_course_repo: lecture-code-f2026
        from_path: mlpkg/simulation
  lecture-4:
    session: 4
    details: Regularisation, and what overfitting looks like before the test set tells you.
    event_datetime: 2026-09-22T10:00
    files:
      - from_course_repo: course-materials-f2026
        from_path: lectures/04_week-4
        release_datetime: 2026-09-22T09:00
  lecture-5:
    session: 5
    event_datetime: 2026-09-29T10:00
    files:
      - from_course_repo: course-materials-f2026
        from_path: lectures/05_week-5
        release_datetime: 2026-09-29T09:00
      - from_course_repo: lecture-code-f2026
        from_path: mlpkg/training

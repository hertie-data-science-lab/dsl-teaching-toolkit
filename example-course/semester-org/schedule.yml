# Worked example: the hertie-dsl-demo-f2026 semester's whole term in one file.
#
# - full schema: https://github.com/hertie-data-science-lab/dsl-teaching-toolkit/blob/main/docs/07-schedule-releases.md
# - see deployed end-product: https://hertie-dsl-demo-f2026.github.io/schedule/
#
# One block per kind (lectures, labs, readings, exams, events, assets) and assignments; each
# a map whose KEY names what the toolkit creates for the entry (its site row and ids; an
# assignment's repos and mark sheet) and is never displayed or read for a number.
#   session         the teaching unit: REQUIRED on lectures and labs; on readings it shows
#                   them on the unit's first row (absent = a row of their own)
#   number          optional, default = session: the row word ("Lab 2")
#   event_datetime  a datetime, `tbc`, or a list of slots {at, location, details}
#   files           from_course_repo, from_path, to_semester_repo, to_path, release_datetime
#                   (default: an hour before the first slot)
# Assignments carry their run settings inline (late_window_days, ..., repo_name).

timezone: Europe/Berlin
semester_start: 2026-09-07
semester_end: 2026-12-18
archive:
  event_datetime: 2027-02-16
  title: Semester archived
  show_on_site: true
  details: 'This semester is archived on {date}: every repository in it becomes read-only. You keep read access, so you can still fork or clone anything you want to keep working on into your own account.'
lectures:
  lecture-1:
    session: 1
    title: Perceptrons and gradient descent
    details: What a linear model can and cannot separate, and how gradient descent finds its weights.
    event_datetime: 2026-09-01T10:00
    files:
      - from_course_repo: course-materials-f2026
        from_path: lectures/01_week-1
        release_datetime: 2026-09-01T09:00
      - from_course_repo: lecture-code-f2026
        from_path: mlpkg/core
  lecture-2:
    session: 2
    title: Backpropagation
    details: How a network computes its own gradients, and why the chain rule is the whole trick.
    event_datetime: 2026-09-08T10:00

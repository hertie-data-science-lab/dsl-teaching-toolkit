[tool.pytest.ini_options]
# Put the repo root (for `import dsl_course`) and tests/ (for `import conftest`) on the
# path so tests run from anywhere without an installed package.
pythonpath = [".", "tests"]
testpaths = ["tests"]
# `tests/e2e` drives real workflows in the demo orgs and is skipped wholesale unless
# DSL_E2E=1 (tests/e2e/conftest.py). The marker is registered so the suite can be selected
# or deselected by name, and so `--strict-markers` never turns it into an error.
markers = ["e2e: live end-to-end run against the demo tier"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
ignore = [
    # `date.today()` is deliberate wherever it appears: access windows (people.yml
    # start/end) and the site's own dates are day-granular, and Actions runners are UTC,
    # so stamping them with a cohort timezone would not make them more correct. The
    # timezone-sensitive code - schedule.yml parsing - is tz-aware and tested as such.
    "DTZ011",
    # Blind excepts here guard best-effort paths (a site sync after bootstrap, an org
    # lookup during discovery) that must never fail their caller.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# Fixtures construct naive datetimes on purpose - reading them in the cohort's timezone is
# the behaviour under test, so a tz-aware fixture would test nothing.
"tests/*" = ["DTZ001"]

    role: instructor
    name: "Jan Gieseler"
    email: "staff@example.org"
    photo: "/_images/pp/2025_JG.png"
    url: "https://hertie-school.org/en/datasciencelab"
  - github_handle: "cpj97"
    role: teaching_assistant
    name: "Camilo Pedraza Jiménez"

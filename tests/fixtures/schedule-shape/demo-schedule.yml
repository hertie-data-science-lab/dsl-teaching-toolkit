    event_datetime: 2026-09-15T10:00
    files:
      - from_course_repo: course-materials-f2026
        from_path: lectures/07_natural-language-processing-1
        release_datetime: 2026-09-15T08:00
  lecture-08:
    session: 8
    title: 'Natural language processing (2): Encoder-decoder architecture and attention'
    details: The attention mechanism and the transformer, read through the papers that introduced them.
    event_datetime: 2026-09-22T10:00
    files:
      - from_course_repo: course-materials-f2026
        from_path: lectures/08_nlp-2-encoder-decoder-and-attention
        release_datetime: 2026-09-22T08:00
  lecture-09:
    session: 9
    title: Further topics in deep learning
    details: Uncertainty quantification, generative models, and the state of the research frontier.
    event_datetime: 2026-09-29T10:00
    files:
      - from_course_repo: lecture-code-f2026

        release_datetime: 2026-08-04T08:00
  lecture-02:
    session: 2
    title: Deep neural networks (1)
    details: Perceptrons, activation functions and the forward pass; why depth buys representational power.
    event_datetime: 2026-08-11T10:00
    files:
      - from_course_repo: course-materials-f2026
        from_path: lectures/02_deep-neural-networks-1
        release_datetime: 2026-08-11T08:00

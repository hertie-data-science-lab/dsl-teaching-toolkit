    session: 4
    title: 'Computer vision (1): Convolutional neural networks'
    details: Convolution, pooling and parameter sharing, and why they suit images.
    event_datetime: 2026-08-25T10:00
    files:
      - from_course_repo: course-materials-f2026
        from_path: lectures/04_computer-vision-1-cnns
        release_datetime: 2026-08-25T08:00
  lecture-05:
    session: 5
    title: 'Computer vision (2): Modern CNNs, implementation and applications'
    details: Residual connections and modern architectures, with applications to satellite imagery for policy.
    event_datetime: 2026-09-01T10:00
    files:
      - from_course_repo: course-materials-f2026
        from_path: lectures/05_computer-vision-2-modern-cnns
        release_datetime: 2026-09-01T08:00
  lecture-06:
    session: 6
    title: Sequence methods and time-series analysis
    details: Recurrent architectures and their limits; where classical time-series methods remain the better tool.
    event_datetime: 2026-09-08T10:00
    files:
      - from_course_repo: course-materials-f2026
        from_path: lectures/06_sequence-methods-and-time-series
        release_datetime: 2026-09-08T08:00
  lecture-07:
